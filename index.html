<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agência Hub — Casa Publicidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3;}
:root{--purple:#534AB7;--purpleL:#EEEDFE;--purpleM:#7F77DD;--green:#1D9E75;--greenL:#EAF3DE;--greenD:#3B6D11;--red:#E24B4A;--redL:#FCEBEB;--redD:#A32D2D;--amber:#EF9F27;--amberL:#FAEEDA;--amberD:#854F0B;--blue:#378ADD;--blueL:#E6F1FB;--blueD:#185FA5;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);}
button{cursor:pointer;font-family:inherit;transition:opacity .15s;}
button:hover{opacity:.85;}
input,select,textarea{font-family:inherit;}
.hidden{display:none!important;}
a{text-decoration:none;color:inherit;}

/* ── AUTH ── */
#authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f3;}
.auth-box{background:#fff;border:0.5px solid var(--border);border-radius:16px;padding:40px 36px;width:380px;max-width:92vw;}
.auth-logo{width:46px;height:46px;border-radius:11px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin-bottom:22px;}
.auth-h{font-size:20px;font-weight:500;margin-bottom:3px;}
.auth-s{font-size:13px;color:#666;margin-bottom:26px;}
.auth-err{background:var(--redL);color:var(--redD);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;}
.fl{font-size:11px;font-weight:500;color:#666;margin-bottom:4px;display:block;}
.fi{width:100%;border:0.5px solid var(--border2);border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:12px;outline:none;}
.fi:focus{border-color:var(--purple);}
.btn-auth{width:100%;background:var(--purple);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:500;margin-top:6px;}

/* ── SHELL ── */
#shell{display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sb{width:215px;background:#f0f0ee;border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sb-head{padding:15px 13px 11px;border-bottom:0.5px solid var(--border);}
.sb-title{font-size:13px;font-weight:600;}
.sb-sub{font-size:10px;color:#999;margin-top:1px;}
.sb-sec{padding:9px 9px 3px;}
.sb-lbl{font-size:10px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.05em;padding:0 3px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.sb-lbl button{background:none;border:none;font-size:16px;color:#999;line-height:1;padding:0;opacity:1;}
.nav-it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:#555;margin-bottom:2px;transition:background .12s;}
.nav-it:hover{background:rgba(0,0,0,0.05);color:#1a1a1a;}
.nav-it.on{background:var(--purpleL);color:var(--purple);font-weight:500;}
.nav-ico{width:15px;text-align:center;font-size:13px;flex-shrink:0;}
.cl-list{flex:1;overflow-y:auto;padding:4px 7px 8px;}
.cl-it{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:background .12s;}
.cl-it:hover{background:rgba(0,0,0,0.05);}
.cl-it.on{background:var(--purpleL);}
.cl-av{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
.cl-nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-pr{font-size:10px;color:#999;}
.sb-bot{margin-top:auto;padding:10px 12px;border-top:0.5px solid var(--border);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:10px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;background:#fff;flex-shrink:0;}
.tb-title{font-size:14px;font-weight:500;flex:1;}
.tb-title span{font-weight:400;color:#999;}
.content{flex:1;overflow-y:auto;padding:20px;}

/* ── TABS ── */
.tabs{display:flex;border-bottom:0.5px solid var(--border);padding:0 20px;background:#fff;flex-shrink:0;}
.tab{padding:9px 13px;font-size:12px;cursor:pointer;color:#666;border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;transition:all .12s;}
.tab:hover{color:#1a1a1a;}
.tab.on{color:var(--purple);border-bottom-color:var(--purple);font-weight:500;}

/* ── BADGES ── */
.bdg{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;white-space:nowrap;display:inline-block;}
.b-urg{background:var(--redL);color:var(--redD);}
.b-alt{background:var(--amberL);color:var(--amberD);}
.b-ok{background:var(--greenL);color:var(--greenD);}
.b-inf{background:var(--blueL);color:var(--blueD);}
.b-gray{background:#F1EFE8;color:#5F5E5A;}

/* ── METRICS ── */
.met-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.met{border-radius:10px;padding:13px 15px;}
.met-l{font-size:10px;margin-bottom:3px;}
.met-v{font-size:24px;font-weight:500;}

/* ── CHARTS ── */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.chart-box{background:#f0f0ee;border-radius:10px;padding:13px;}
.chart-box-t{font-size:11px;font-weight:500;color:#666;margin-bottom:10px;}
.chart-wrap{position:relative;width:100%;}

/* ── CARDS ── */
.card{background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:14px;transition:border-color .12s;}
.card:hover{border-color:var(--border2);}
.card.sel{border:1.5px solid var(--purple);}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:16px;}
.prog{height:4px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden;margin:8px 0 5px;}
.prog-f{height:100%;border-radius:4px;}

/* ── KANBAN ── */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.kc{background:#f0f0ee;border-radius:9px;padding:9px;}
.kc-h{font-size:10px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.kc-n{background:#fff;border:0.5px solid var(--border);width:17px;height:17px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;}
.kcard{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:9px;margin-bottom:6px;cursor:pointer;}
.kcard:hover{border-color:var(--border2);}
.kcard-t{font-size:11px;font-weight:500;margin-bottom:5px;line-height:1.35;}
.kcard-m{display:flex;justify-content:space-between;font-size:10px;color:#999;}
.udot{width:5px;height:5px;border-radius:50%;background:var(--red);display:inline-block;margin-right:4px;vertical-align:middle;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;font-size:10px;font-weight:500;color:#999;padding:7px 10px;border-bottom:0.5px solid var(--border);}
.tbl td{padding:9px 10px;border-bottom:0.5px solid rgba(0,0,0,.06);vertical-align:middle;}
.tbl tr:hover td{background:#fafafa;}

/* ── CHECKLIST ── */
.ck-list{border:0.5px solid var(--border);border-radius:9px;overflow:hidden;}
.ck-it{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:0.5px solid rgba(0,0,0,.06);font-size:12px;}
.ck-it:last-child{border:none;}
.ck-it.done span{text-decoration:line-through;color:#bbb;}
.ck-it input{accent-color:var(--purple);cursor:pointer;}

/* ── COMMENTS ── */
.cmt-box{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;}
.cmt{padding:10px 14px;border-bottom:0.5px solid rgba(0,0,0,.06);}
.cmt:last-child{border:none;}
.cmt-h{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.cmt-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;}
.cmt-au{font-size:11px;font-weight:500;}
.cmt-tm{font-size:10px;color:#bbb;margin-left:auto;}
.cmt-tx{font-size:12px;color:#555;line-height:1.5;}
.inp-row{display:flex;gap:8px;padding:9px 14px;background:#f5f5f3;}
.cmt-inp{flex:1;font-size:12px;border:0.5px solid var(--border2);border-radius:8px;padding:6px 10px;background:#fff;outline:none;}
.cmt-inp:focus{border-color:var(--purple);}

/* ── DELIVERIES ── */
.del-it{background:#fff;border:0.5px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.del-h{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;}
.del-h:hover{background:#fafafa;}
.del-body{border-top:0.5px solid var(--border);padding:14px 15px;}

/* ── MODAL ── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:300;}
.mbox{background:#fff;border-radius:16px;border:0.5px solid var(--border);width:410px;max-width:93vw;max-height:90vh;overflow-y:auto;padding:22px;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.mt{font-size:15px;font-weight:500;}
.mx{cursor:pointer;font-size:22px;color:#999;line-height:1;background:none;border:none;padding:0;}
.fg{margin-bottom:12px;}
.fg label{font-size:11px;font-weight:500;color:#666;margin-bottom:4px;display:block;}
.fg input,.fg select,.fg textarea{width:100%;border:0.5px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:12px;outline:none;font-family:inherit;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple);}
.fg textarea{min-height:72px;resize:vertical;}
.mft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}

/* ── BUTTONS ── */
.bp{font-size:12px;padding:6px 15px;border-radius:8px;border:none;background:var(--purple);color:#fff;}
.bo{font-size:12px;padding:6px 15px;border-radius:8px;border:0.5px solid var(--border2);background:#fff;color:#1a1a1a;}
.bsm{font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border2);background:#fff;color:#1a1a1a;}

/* ── FILTER BAR ── */
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.fbar select{font-size:12px;padding:5px 8px;border:0.5px solid var(--border2);border-radius:8px;background:#fff;outline:none;}

/* ── CLIENT PORTAL ── */
#portal{min-height:100vh;background:#f5f5f3;}
.pnav{background:#fff;border-bottom:0.5px solid var(--border);padding:0 24px;display:flex;align-items:center;flex-wrap:wrap;}
.plogo{display:flex;align-items:center;gap:9px;padding:12px 20px 12px 0;margin-right:20px;border-right:0.5px solid var(--border);}
.ptabs{display:flex;flex:1;}
.ptab{padding:13px 13px;font-size:12px;cursor:pointer;color:#666;border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;transition:all .12s;}
.ptab:hover{color:#1a1a1a;}
.ptab.on{color:var(--purple);border-bottom-color:var(--purple);font-weight:500;}
.puser{display:flex;align-items:center;gap:8px;padding:8px 0;margin-left:auto;}
.pbody{padding:24px;max-width:920px;margin:0 auto;}
.hero{background:#fff;border:0.5px solid var(--border);border-radius:14px;padding:19px 23px;margin-bottom:18px;display:flex;align-items:center;gap:14px;}

/* ── SOL FORM ── */
.sol-form{background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:18px;}
.up-zone{border:1px dashed var(--border2);border-radius:8px;padding:20px;text-align:center;cursor:pointer;position:relative;transition:background .12s;}
.up-zone:hover{background:#f5f5f3;}
.up-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.f-chip{display:inline-flex;align-items:center;gap:5px;background:#f0f0f0;border-radius:4px;padding:3px 8px;font-size:11px;margin:3px 3px 0 0;}
.chip-x{cursor:pointer;color:#999;font-size:14px;line-height:1;background:none;border:none;padding:0;}

.empty{text-align:center;padding:32px;color:#bbb;font-size:12px;}
.sec-t{font-size:13px;font-weight:500;margin-bottom:10px;}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authWrap">
  <div class="auth-box">
    <div class="auth-logo">AH</div>
    <div class="auth-h">Agência Hub</div>
    <div class="auth-s">Casa Publicidade — acesse sua conta</div>
    <div class="auth-err hidden" id="authErr"></div>
    <label class="fl">E-mail</label>
    <input class="fi" id="aEmail" type="email" placeholder="seu@email.com">
    <label class="fl">Senha</label>
    <input class="fi" id="aPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-auth" onclick="login()">Entrar</button>
  </div>
</div>

<!-- AGENCY SHELL -->
<div id="shell" class="hidden">
  <div class="sb">
    <div class="sb-head">
      <div class="sb-title">Agência Hub</div>
      <div class="sb-sub">Casa Publicidade</div>
    </div>
    <div class="sb-sec">
      <div class="sb-lbl">Menu</div>
      <div class="nav-it on" id="nv-dashboard" onclick="gv('dashboard')"><span class="nav-ico">⊞</span>Dashboard</div>
      <div class="nav-it" id="nv-all-tasks" onclick="gv('all-tasks')"><span class="nav-ico">✓</span>Todas as tarefas</div>
      <div class="nav-it" id="nv-team" onclick="gv('team')"><span class="nav-ico">◎</span>Equipe</div>
    </div>
    <div class="sb-sec">
      <div class="sb-lbl">Clientes <button onclick="om('client',{})">+</button></div>
    </div>
    <div class="cl-list" id="clList"></div>
    <div class="sb-bot">
      <button class="bo" style="width:100%;font-size:11px;" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="tb-title" id="tbT">Dashboard</div>
      <div id="tbA"></div>
    </div>
    <div class="tabs hidden" id="clTabs">
      <div class="tab on" data-t="projetos" onclick="st(this)">Projetos</div>
      <div class="tab" data-t="kanban" onclick="st(this)">Kanban</div>
      <div class="tab" data-t="checklist" onclick="st(this)">Checklist</div>
      <div class="tab" data-t="entregas" onclick="st(this)">Entregas</div>
      <div class="tab" data-t="comentarios" onclick="st(this)">Comentários</div>
      <div class="tab" data-t="solicitacoes" onclick="st(this)">Solicitações</div>
    </div>
    <div class="content" id="mc"></div>
  </div>
</div>

<!-- CLIENT PORTAL -->
<div id="portal" class="hidden">
  <div class="pnav">
    <div class="plogo">
      <div style="width:30px;height:30px;border-radius:7px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">AH</div>
      <div><div style="font-size:12px;font-weight:500;">Agência Hub</div><div style="font-size:10px;color:#999;">Portal do cliente</div></div>
    </div>
    <div class="ptabs">
      <div class="ptab on" data-p="visao" onclick="spt(this)">Visão geral</div>
      <div class="ptab" data-p="entregas" onclick="spt(this)">Entregas</div>
      <div class="ptab" data-p="solicitar" onclick="spt(this)">Solicitar tarefa</div>
      <div class="ptab" data-p="comunicacao" onclick="spt(this)">Comunicação</div>
    </div>
    <div class="puser">
      <div id="pAv" style="width:28px;height:28px;border-radius:50%;background:var(--purpleL);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;">?</div>
      <div><div id="pNm" style="font-size:12px;font-weight:500;"></div><div id="pEm" style="font-size:10px;color:#999;"></div></div>
      <button class="bo" style="font-size:11px;padding:4px 10px;margin-left:8px;" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="pbody" id="pc"></div>
</div>

<!-- MODAL -->
<div class="mov hidden" id="mov" onclick="if(event.target===this)cm()">
  <div class="mbox" id="mb"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,updateDoc,onSnapshot,query,where,orderBy,serverTimestamp,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const FB={apiKey:"AIzaSyDa3_tWC7eIL2BKsDsxr25_VuwACPGogLM",authDomain:"casa-publicidade.firebaseapp.com",projectId:"casa-publicidade",storageBucket:"casa-publicidade.firebasestorage.app",messagingSenderId:"204202554588",appId:"1:204202554588:web:ab4c81426f8555c70af019"};
const app=initializeApp(FB),auth=getAuth(app),db=getFirestore(app);

// ── CONSTANTS ──
const CC=["#534AB7","#0F6E56","#993C1D","#185FA5","#639922","#993556"];
const CB=["#EEEDFE","#E1F5EE","#FAECE7","#E6F1FB","#EAF3DE","#FBEAF0"];
const PC={urgente:['#FCEBEB','#A32D2D'],alta:['#FAEEDA','#854F0B'],normal:['#EAF3DE','#3B6D11']};
const SL={todo:'A fazer',doing:'Em andamento',review:'Revisão',done:'Concluído'};
const SC={todo:['#F1EFE8','#5F5E5A'],doing:['#E6F1FB','#185FA5'],review:['#FAEEDA','#854F0B'],done:['#EAF3DE','#3B6D11']};

// ── STATE ──
const S={profile:null,view:'dashboard',acl:null,atab:'projetos',aproj:null,ptab:'visao',
  clients:[],projects:[],tasks:[],checklist:[],comments:[],deliveries:[],requests:[],
  op:{},oe:{},unsubs:[],charts:{}};

// ── HELPERS ──
const cc=id=>{const i=Math.max(0,S.clients.findIndex(c=>c.id===id));return{color:CC[i%CC.length],bg:CB[i%CB.length]};};
const bdg=(l,bg,c)=>`<span class="bdg" style="background:${bg};color:${c};">${l}</span>`;
const pb=p=>{const c=PC[p]||PC.normal;return bdg(p||'normal',c[0],c[1]);};
const sb=s=>{const c=SC[s]||SC.todo;return bdg(SL[s]||s,c[0],c[1]);};
const av=(i,c,b,s=24)=>`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${b};color:${c};display:flex;align-items:center;justify-content:center;font-size:${Math.floor(s*.4)}px;font-weight:600;flex-shrink:0;">${i}</div>`;
const ft=ts=>{if(!ts)return'';try{const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return'';}};
const show=w=>{['authWrap','shell','portal'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==w));};
const dc=id=>{if(S.charts[id]){S.charts[id].destroy();delete S.charts[id];}};

// ── AUTH ──
window.login=async()=>{
  const e=document.getElementById('aEmail').value.trim(),p=document.getElementById('aPass').value;
  const err=document.getElementById('authErr');err.classList.add('hidden');
  try{await signInWithEmailAndPassword(auth,e,p);}
  catch{err.textContent='E-mail ou senha incorretos.';err.classList.remove('hidden');}
};
window.logout=async()=>{S.unsubs.forEach(u=>u());S.unsubs=[];await signOut(auth);show('authWrap');};

onAuthStateChanged(auth,async u=>{
  if(!u){show('authWrap');return;}
  const snap=await getDoc(doc(db,'users',u.uid));
  if(!snap.exists()){show('authWrap');document.getElementById('authErr').textContent='Usuário não configurado.';document.getElementById('authErr').classList.remove('hidden');await signOut(auth);return;}
  S.profile={uid:u.uid,email:u.email,...snap.data()};
  S.profile.role==='agency'?startAgency():startPortal();
});

// ── AGENCY ──
function startAgency(){
  show('shell');S.unsubs.forEach(u=>u());S.unsubs=[];
  S.unsubs=[
    onSnapshot(query(collection(db,'clients'),orderBy('createdAt','desc')),s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));renderCL();rv();}),
    onSnapshot(query(collection(db,'projects'),orderBy('createdAt','desc')),s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'tasks'),orderBy('createdAt','desc')),s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'checklist'),orderBy('order','asc')),s=>{S.checklist=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'comments'),orderBy('createdAt','asc')),s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'deliveries'),orderBy('createdAt','desc')),s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'requests'),orderBy('createdAt','desc')),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
  ];
}

function renderCL(){
  const el=document.getElementById('clList');if(!el)return;
  el.innerHTML=S.clients.map(c=>{const k=cc(c.id);return`<div class="cl-it ${S.acl===c.id&&S.view==='client'?'on':''}" onclick="selCl('${c.id}')">
    <div class="cl-av" style="background:${k.bg};color:${k.color};">${c.initials||'?'}</div>
    <div style="flex:1;min-width:0;"><div class="cl-nm">${c.name}</div><div class="cl-pr">${S.projects.filter(p=>p.clientId===c.id).length} proj.</div></div>
  </div>`;}).join('');
}

window.gv=v=>{
  S.view=v;S.acl=null;
  document.querySelectorAll('.nav-it').forEach(e=>e.classList.remove('on'));
  document.getElementById('nv-'+v)?.classList.add('on');
  document.querySelectorAll('.cl-it').forEach(e=>e.classList.remove('on'));
  document.getElementById('clTabs').classList.add('hidden');
  rv();
};
window.selCl=id=>{
  S.acl=id;S.view='client';S.atab='projetos';S.aproj=null;
  document.querySelectorAll('.nav-it,.cl-it').forEach(e=>e.classList.remove('on'));
  document.getElementById('clTabs').classList.remove('hidden');
  document.querySelectorAll('#clTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.t==='projetos'));
  renderCL();rv();
};
window.st=el=>{
  document.querySelectorAll('#clTabs .tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');S.atab=el.dataset.t;S.aproj=null;rv();
};

function rv(){
  const ti=document.getElementById('tbT'),ac=document.getElementById('tbA');if(!ti)return;
  if(S.view==='dashboard'){
    ti.innerHTML='Dashboard';ac.innerHTML=`<button class="bp" onclick="om('client',{})">+ Cliente</button>`;
    renderDash();
  }else if(S.view==='all-tasks'){
    ti.innerHTML='Todas as tarefas';ac.innerHTML='';renderAllTasks();
  }else if(S.view==='team'){
    ti.innerHTML='Equipe';ac.innerHTML='';renderTeam();
  }else if(S.view==='client'){
    const c=S.clients.find(x=>x.id===S.acl);if(!c)return;
    ti.innerHTML=`<span>Clientes / </span>${c.name}`;
    ac.innerHTML=`<button class="bo" style="margin-right:8px;" onclick="om('cview',{})">👁 Ver como cliente</button><button class="bp" onclick="om('proj',{clientId:'${c.id}'})">+ Projeto</button>`;
    renderCV();
  }
}

window.ftT=()=>{
  const fc=document.getElementById('ftC')?.value,fs=document.getElementById('ftS')?.value,fa=document.getElementById('ftA')?.value;
  let t=S.tasks;
  if(fc)t=t.filter(x=>x.clientId===fc);if(fs)t=t.filter(x=>x.status===fs);if(fa)t=t.filter(x=>x.assignee===fa);
  const el=document.getElementById('ttbl');if(!el)return;
  if(!t.length){el.innerHTML='<div class="empty">Nenhuma tarefa.</div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr>${['Tarefa','Cliente','Projeto','Responsável','Status','Prazo',''].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
  ${t.map(x=>{const cl=S.clients.find(c=>c.id===x.clientId);const pr=S.projects.find(p=>p.id===x.projectId);const k=cl?cc(cl.id):{color:'#666',bg:'#eee'};return`<tr>
    <td style="font-weight:500;">${x.urgent?'<span class="udot"></span>':''}${x.title}</td>

    <td><button class="bsm" onclick='om("task",${JSON.stringify(x).replace(/'/g,"&#39;")})'>Editar</button></td>
  </tr>`;}).join('')}</tbody></table>`;
};

window.saveCl=async()=>{

function startPortal(){
  show('portal');
  const cid=S.profile.clientId;
  document.getElementById('pEm').textContent=S.profile.email||'';
  S.unsubs.forEach(u=>u());S.unsubs=[];
  if(!cid){document.getElementById('pc').innerHTML='<div class="empty" style="padding:60px;">Conta não configurada. Contate a agência.</div>';return;}
  S.unsubs=[
    onSnapshot(doc(db,'clients',cid),s=>{if(s.exists()){S.cd={id:s.id,...s.data()};document.getElementById('pAv').textContent=S.cd.initials||'?';document.getElementById('pNm').textContent=S.cd.name||'';rp();}}),
    onSnapshot(query(collection(db,'projects'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'checklist'),orderBy('order','asc')),s=>{S.checklist=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'deliveries'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'comments'),orderBy('createdAt','asc')),s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'requests'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
  ];
}

      <div class="fg"><label>Projeto</label><select id="ps-pj"><option value="">Sem projeto específico</option>${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
      <div class="fg"><label>Prioridade</label><select id="ps-pr"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
      <div class="fg"><label>Descrição detalhada</label><textarea id="ps-dc" placeholder="Descreva o que precisa, contexto, onde será usado..."></textarea></div>
      <div class="fg"><label>Links de referência</label><input id="ps-lk" placeholder="https://... (separe por vírgula)"></div>
      <div id="ps-ok" style="display:none;background:var(--greenL);color:var(--greenD);border-radius:8px;padding:9px;font-size:12px;margin-bottom:10px;text-align:center;">Solicitação enviada com sucesso!</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="bo" onclick="['ps-ti','ps-dc','ps-lk'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''})">Limpar</button>
        <button class="bp" onclick="submitReq()">Enviar solicitação</button>
      </div>
    </div></div>
    <div><div class="sec-t">Solicitações enviadas</div>
    ${S.requests.map(r=>`<div style="background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;"><div style="display:flex;justify-content:space-between;margin-bottom:5px;"><div style="font-size:13px;font-weight:500;">${r.title}</div><div style="display:flex;gap:5px;">${pb(r.priority)}${bdg(r.status,r.status==='recebido'?'var(--blueL)':'var(--greenL)',r.status==='recebido'?'var(--blueD)':'var(--greenD)')}</div></div><div style="font-size:11px;color:#555;margin-bottom:3px;">${r.description||''}</div><div style="font-size:10px;color:#bbb;">${r.type||''} · ${ft(r.createdAt)}</div></div>`).join('')}
    ${S.requests.length===0?'<div style="background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:30px;text-align:center;font-size:12px;color:#bbb;">Nenhuma solicitação ainda</div>':''}
    </div></div>`;

  }else if(tab==='comunicacao'){
    mc.innerHTML=`<div class="sec-t">Mensagens por projeto</div>
    ${ps.map(p=>{const pcmts=S.comments.filter(cm=>cm.projectId===p.id&&!cm.deliveryId);return`<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:500;margin-bottom:7px;">${p.name}</div><div class="cmt-box">${pcmts.map(cm=>`<div class="cmt"><div class="cmt-h"><div class="cmt-av" style="background:${cm.authorRole==='agency'?'#534AB7':'#EEEDFE'};color:${cm.authorRole==='agency'?'#fff':'#534AB7'};">${(cm.authorName||'?')[0]}</div><span class="cmt-au">${cm.authorName}</span><span class="cmt-tm">${ft(cm.createdAt)}</span></div><div class="cmt-tx">${cm.text}</div></div>`).join('')}${pcmts.length===0?'<div class="empty">Sem mensagens</div>':''}<div class="inp-row"><input class="cmt-inp" id="pco-${p.id}" placeholder="Enviar mensagem..."><button class="bp" onclick="sendPCO('${p.id}')">Enviar</button></div></div></div>`;}).join('')}
    ${ps.length===0?'<div class="empty">Nenhum projeto ativo</div>':''}`;
  }
}

window.approveDel=async id=>{await updateDoc(doc(db,'deliveries',id),{status:'aprovado'});await addDoc(collection(db,'comments'),{deliveryId:id,text:'Entrega aprovada! ✓',authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});};
window.sendPDC=async id=>{const el=document.getElementById('pdc-'+id);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{deliveryId:id,text:t,authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});el.value='';};
window.sendPCO=async pid=>{const el=document.getElementById('pco-'+pid);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{projectId:pid,text:t,authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});el.value='';};
window.submitReq=async()=>{
  const ti=document.getElementById('ps-ti')?.value.trim(),dc=document.getElementById('ps-dc')?.value.trim();
  if(!ti||!dc)return alert('Preencha título e descrição.');
  const ty=document.getElementById('ps-ty')?.value,pj=document.getElementById('ps-pj')?.value,pr=document.getElementById('ps-pr')?.value;
  const lk=document.getElementById('ps-lk')?.value.trim();
  const fileLinks=lk?lk.split(',').map(l=>l.trim()).filter(Boolean):[];
  const proj=S.projects.find(p=>p.id===pj);
  await addDoc(collection(db,'requests'),{title:ti,description:dc,type:ty,projectId:pj||'',projectName:proj?.name||'',priority:pr,fileLinks,clientId:S.profile.clientId,clientName:S.cd?.name||'',status:'recebido',createdAt:serverTimestamp()});
  ['ps-ti','ps-dc','ps-lk'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  const ok=document.getElementById('ps-ok');if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);}
};

document.addEventListener('keydown',e=>{if(e.key==='Escape')cm();});
</script>
</body>
</html>
