<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agência Hub — Casa Publicidade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f5f5f3;}
:root{--purple:#534AB7;--purpleL:#EEEDFE;--green:#1D9E75;--greenL:#EAF3DE;--greenD:#3B6D11;--red:#E24B4A;--redL:#FCEBEB;--redD:#A32D2D;--amber:#EF9F27;--amberL:#FAEEDA;--amberD:#854F0B;--blue:#378ADD;--blueL:#E6F1FB;--blueD:#185FA5;--border:rgba(0,0,0,0.1);}
button{cursor:pointer;font-family:inherit;}input,select,textarea{font-family:inherit;}.hidden{display:none!important;}
#authScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.auth-card{background:#fff;border:0.5px solid var(--border);border-radius:16px;padding:40px 36px;width:380px;max-width:90vw;}
.auth-logo{width:44px;height:44px;border-radius:10px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;margin-bottom:20px;}
.form-lbl{font-size:11px;font-weight:500;color:#666;margin-bottom:4px;display:block;}
.form-inp{width:100%;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:14px;outline:none;}
.form-inp:focus{border-color:var(--purple);}
.btn-primary{width:100%;background:var(--purple);color:#fff;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:500;margin-top:6px;cursor:pointer;}
.auth-err{background:#FCEBEB;color:#A32D2D;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;}
#app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:210px;background:#f5f5f3;border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sb-head{padding:14px 12px 10px;border-bottom:0.5px solid var(--border);}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:12px;color:#666;margin-bottom:2px;}
.nav-item:hover{background:rgba(0,0,0,0.04);color:#1a1a1a;}
.nav-item.active{background:var(--purpleL);color:var(--purple);font-weight:500;}
.client-scroll{flex:1;overflow-y:auto;padding:4px 6px 8px;}
.cl-item{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
.cl-item:hover{background:rgba(0,0,0,0.04);}
.cl-item.active{background:var(--purpleL);}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:10px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;background:#fff;flex-shrink:0;}
.tabs{display:flex;border-bottom:0.5px solid var(--border);padding:0 20px;background:#fff;flex-shrink:0;}
.tab{padding:9px 13px;font-size:12px;cursor:pointer;color:#666;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap;}
.tab.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:500;}
.content{flex:1;overflow-y:auto;padding:18px 20px;}
.badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:500;}
.metric{border-radius:8px;padding:12px 14px;}
.prog-bar{height:4px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden;margin:8px 0 5px;}
.prog-fill{height:100%;border-radius:4px;}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.k-col{background:#f5f5f3;border-radius:8px;padding:8px;}
.k-head{font-size:10px;font-weight:500;color:#666;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.k-card{background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:9px;margin-bottom:6px;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;font-size:10px;font-weight:500;color:#999;padding:7px 10px;border-bottom:0.5px solid var(--border);}
.tbl td{padding:9px 10px;border-bottom:0.5px solid rgba(0,0,0,0.06);}
.check-list{border:0.5px solid var(--border);border-radius:8px;overflow:hidden;}
.check-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:0.5px solid rgba(0,0,0,0.06);font-size:12px;}
.cmt-thread{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;}
.cmt{padding:10px 13px;border-bottom:0.5px solid rgba(0,0,0,0.06);}
.cmt-inp-row{display:flex;gap:8px;padding:9px 13px;background:#f5f5f3;}
.cmt-inp{flex:1;font-size:12px;border:0.5px solid rgba(0,0,0,0.15);border-radius:8px;padding:6px 9px;background:#fff;outline:none;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;z-index:200;}
.modal{background:#fff;border-radius:16px;border:0.5px solid var(--border);width:400px;max-width:92vw;max-height:88vh;overflow-y:auto;padding:22px;}
.fg{margin-bottom:12px;}.fg label{font-size:11px;font-weight:500;color:#666;margin-bottom:4px;display:block;}
.fg input,.fg select,.fg textarea{width:100%;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;padding:7px 10px;font-size:12px;outline:none;}
.fg textarea{min-height:72px;resize:vertical;}
.btn-p{font-size:12px;padding:6px 14px;border-radius:8px;border:none;background:var(--purple);color:#fff;cursor:pointer;}
.btn-o{font-size:12px;padding:6px 14px;border-radius:8px;border:0.5px solid rgba(0,0,0,0.2);background:#fff;color:#1a1a1a;cursor:pointer;}
.urg-dot{width:5px;height:5px;border-radius:50%;background:#E24B4A;display:inline-block;margin-right:4px;}
#clientApp{min-height:100vh;background:#f5f5f3;}
.pnav{background:#fff;border-bottom:0.5px solid var(--border);padding:0 24px;display:flex;align-items:center;flex-wrap:wrap;}
.ptab{padding:14px 13px;font-size:12px;cursor:pointer;color:#666;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap;}
.ptab.active{color:var(--purple);border-bottom-color:var(--purple);font-weight:500;}
.pbody{padding:24px;max-width:900px;margin:0 auto;}
.empty{text-align:center;padding:30px;color:#bbb;font-size:12px;}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">AH</div>
    <div style="font-size:20px;font-weight:500;margin-bottom:4px;">Agência Hub</div>
    <div style="font-size:13px;color:#666;margin-bottom:28px;">Acesse sua conta</div>
    <div class="auth-err hidden" id="authErr"></div>
    <label class="form-lbl">E-mail</label>
    <input class="form-inp" id="loginEmail" type="email" placeholder="seu@email.com">
    <label class="form-lbl">Senha</label>
    <input class="form-inp" id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn-primary" onclick="doLogin()">Entrar</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="sidebar">
    <div class="sb-head">
      <div style="font-size:13px;font-weight:500;">Agência Hub</div>
      <div style="font-size:10px;color:#999;margin-top:1px;">Casa Publicidade</div>
    </div>
    <div style="padding:8px 8px 4px;">
      <div style="font-size:10px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.05em;padding:0 4px;margin-bottom:4px;">Menu</div>
      <div class="nav-item active" id="nav-dashboard" onclick="goView('dashboard')"><span style="font-size:13px;width:14px;text-align:center;">⊞</span>Dashboard</div>
      <div class="nav-item" id="nav-all-tasks" onclick="goView('all-tasks')"><span style="font-size:13px;width:14px;text-align:center;">✓</span>Todas as tarefas</div>
    </div>
    <div style="padding:8px 8px 4px;">
      <div style="font-size:10px;font-weight:500;color:#bbb;text-transform:uppercase;letter-spacing:.05em;padding:0 4px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;">Clientes<span onclick="openModal('client',{})" style="cursor:pointer;font-size:16px;font-weight:400;line-height:1;">+</span></div>
    </div>
    <div class="client-scroll" id="clientList"></div>
    <div style="margin-top:auto;padding:10px 12px;border-top:0.5px solid var(--border);">
      <button class="btn-o" style="width:100%;font-size:11px;" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div style="font-size:14px;font-weight:500;flex:1;" id="tbTitle">Dashboard</div>
      <div id="tbActions"></div>
    </div>
    <div class="tabs hidden" id="clientTabs">
      <div class="tab active" data-tab="projetos" onclick="swTab(this)">Projetos</div>
      <div class="tab" data-tab="kanban" onclick="swTab(this)">Kanban</div>
      <div class="tab" data-tab="checklist" onclick="swTab(this)">Checklist</div>
      <div class="tab" data-tab="entregas" onclick="swTab(this)">Entregas</div>
      <div class="tab" data-tab="comentarios" onclick="swTab(this)">Comentários</div>
      <div class="tab" data-tab="solicitacoes" onclick="swTab(this)">Solicitações</div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div id="clientApp" class="hidden">
  <div class="pnav">
    <div style="display:flex;align-items:center;gap:9px;padding:12px 20px 12px 0;margin-right:20px;border-right:0.5px solid var(--border);">
      <div style="width:30px;height:30px;border-radius:7px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;">AH</div>
      <div><div style="font-size:12px;font-weight:500;">Agência Hub</div><div style="font-size:10px;color:#999;">Portal do cliente</div></div>
    </div>
    <div style="display:flex;flex:1;">
      <div class="ptab active" data-ptab="visao" onclick="swPTab(this)">Visão geral</div>
      <div class="ptab" data-ptab="entregas" onclick="swPTab(this)">Entregas</div>
      <div class="ptab" data-ptab="solicitar" onclick="swPTab(this)">Solicitar tarefa</div>
      <div class="ptab" data-ptab="comunicacao" onclick="swPTab(this)">Comunicação</div>
    </div>
    <div style="display:flex;align-items:center;gap:7px;padding:8px 0;margin-left:auto;">
      <div id="pAv" style="width:28px;height:28px;border-radius:50%;background:var(--purpleL);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;">?</div>
      <div><div id="pNm" style="font-size:12px;font-weight:500;"></div><div id="pEm" style="font-size:10px;color:#999;"></div></div>
      <button class="btn-o" style="font-size:11px;padding:4px 10px;margin-left:8px;" onclick="doLogout()">Sair</button>
    </div>
  </div>
  <div class="pbody" id="portalContent"></div>
</div>

<div class="modal-ov hidden" id="modalOv" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,updateDoc,onSnapshot,query,where,orderBy,serverTimestamp,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const fbApp=initializeApp({apiKey:"AIzaSyDa3_tWC7eIL2BKsDsxr25_VuwACPGogLM",authDomain:"casa-publicidade.firebaseapp.com",projectId:"casa-publicidade",storageBucket:"casa-publicidade.firebasestorage.app",messagingSenderId:"204202554588",appId:"1:204202554588:web:ab4c81426f8555c70af019"});
const auth=getAuth(fbApp),db=getFirestore(fbApp);

const S={profile:null,view:'dashboard',activeClient:null,activeTab:'projetos',activeProj:null,clientTab:'visao',clients:[],projects:[],tasks:[],checklist:[],comments:[],deliveries:[],requests:[],openProjs:{},openEnts:{},unsubs:[]};
const CC=["#534AB7","#0F6E56","#993C1D","#185FA5","#639922","#993556"];
const CB=["#EEEDFE","#E1F5EE","#FAECE7","#E6F1FB","#EAF3DE","#FBEAF0"];
const PC={urgente:['#FCEBEB','#A32D2D'],alta:['#FAEEDA','#854F0B'],normal:['#EAF3DE','#3B6D11']};
const SL={todo:'A fazer',doing:'Em andamento',review:'Revisão',done:'Concluído'};
const SC={todo:['#F1EFE8','#5F5E5A'],doing:['#E6F1FB','#185FA5'],review:['#FAEEDA','#854F0B'],done:['#EAF3DE','#3B6D11']};

function cc(id){const i=S.clients.findIndex(c=>c.id===id);return{color:CC[i%CC.length],bg:CB[i%CB.length]};}
function bdg(l,bg,c){return`<span class="badge" style="background:${bg};color:${c};">${l}</span>`;}
function pbdg(p){const c=PC[p]||PC.normal;return bdg(p||'normal',c[0],c[1]);}
function sbdg(s){const c=SC[s]||SC.todo;return bdg(SL[s]||s,c[0],c[1]);}
function ava(i,c,b,s=26){return`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${b};color:${c};display:flex;align-items:center;justify-content:center;font-size:${Math.floor(s*.38)}px;font-weight:500;flex-shrink:0;">${i}</div>`;}
function ft(ts){if(!ts)return'';try{const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch{return '';}}
function show(w){['auth','agency','client'].forEach(s=>document.getElementById(s==='auth'?'authScreen':s==='agency'?'app':'clientApp').classList.toggle('hidden',s!==w));}

window.doLogin=async()=>{
  const e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;
  const err=document.getElementById('authErr');err.classList.add('hidden');
  try{await signInWithEmailAndPassword(auth,e,p);}catch{err.textContent='E-mail ou senha incorretos.';err.classList.remove('hidden');}
};

onAuthStateChanged(auth,async u=>{
  if(!u){show('auth');return;}
  const snap=await getDoc(doc(db,'users',u.uid));
  if(!snap.exists()){show('auth');document.getElementById('authErr').textContent='Usuário não configurado.';document.getElementById('authErr').classList.remove('hidden');await signOut(auth);return;}
  S.profile={uid:u.uid,email:u.email,...snap.data()};
  S.profile.role==='agency'?startAgency():startClient();
});

window.doLogout=async()=>{S.unsubs.forEach(u=>u());S.unsubs=[];await signOut(auth);show('auth');};

function startAgency(){
  show('agency');S.unsubs.forEach(u=>u());S.unsubs=[];
  S.unsubs=[
    onSnapshot(query(collection(db,'clients'),orderBy('createdAt','desc')),s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));renderCL();renderView();}),
    onSnapshot(query(collection(db,'projects'),orderBy('createdAt','desc')),s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));renderView();}),
    onSnapshot(query(collection(db,'tasks'),orderBy('createdAt','desc')),s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()}));renderView();}),
    onSnapshot(query(collection(db,'checklist'),orderBy('order','asc')),s=>{S.checklist=s.docs.map(d=>({id:d.id,...d.data()}));renderView();}),
    onSnapshot(query(collection(db,'comments'),orderBy('createdAt','asc')),s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));renderView();}),
    onSnapshot(query(collection(db,'deliveries'),orderBy('createdAt','desc')),s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));renderView();}),
    onSnapshot(query(collection(db,'requests'),orderBy('createdAt','desc')),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));renderView();}),
  ];
}

function renderCL(){
  const el=document.getElementById('clientList');if(!el)return;
  el.innerHTML=S.clients.map(c=>{const k=cc(c.id);return`<div class="cl-item ${S.activeClient===c.id&&S.view==='client'?'active':''}" onclick="selClient('${c.id}')">
    <div style="width:26px;height:26px;border-radius:6px;background:${k.bg};color:${k.color};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;">${c.initials||'?'}</div>
    <div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.name}</div><div style="font-size:10px;color:#999;">${S.projects.filter(p=>p.clientId===c.id).length} proj.</div></div>
  </div>`;}).join('');
}

window.goView=v=>{S.view=v;S.activeClient=null;document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));document.getElementById('nav-'+v)?.classList.add('active');document.querySelectorAll('.cl-item').forEach(e=>e.classList.remove('active'));document.getElementById('clientTabs').classList.add('hidden');renderView();};
window.selClient=id=>{S.activeClient=id;S.view='client';S.activeTab='projetos';S.activeProj=null;document.querySelectorAll('.nav-item,.cl-item').forEach(e=>e.classList.remove('active'));document.getElementById('clientTabs').classList.remove('hidden');document.querySelectorAll('#clientTabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='projetos'));renderCL();renderView();};
window.swTab=el=>{document.querySelectorAll('#clientTabs .tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');S.activeTab=el.dataset.tab;S.activeProj=null;renderView();};

function renderView(){
  const ti=document.getElementById('tbTitle'),ac=document.getElementById('tbActions');if(!ti)return;
  if(S.view==='dashboard'){ti.innerHTML='Dashboard';ac.innerHTML=`<button class="btn-p" onclick="openModal('client',{})">+ Cliente</button>`;renderDash();}
  else if(S.view==='all-tasks'){ti.innerHTML='Todas as tarefas';ac.innerHTML='';renderAllTasks();}
  else if(S.view==='client'){const c=S.clients.find(x=>x.id===S.activeClient);if(!c)return;ti.innerHTML=`<span style="color:#999;font-weight:400;">Clientes / </span>${c.name}`;ac.innerHTML=`<button class="btn-o" style="margin-right:8px;" onclick="openModal('cview',{})">👁 Ver como cliente</button><button class="btn-p" onclick="openModal('proj',{clientId:'${c.id}'})">+ Projeto</button>`;renderCV();}
}

function renderDash(){
  const urg=S.tasks.filter(t=>t.urgent&&t.status!=='done');
  const pend=S.requests.filter(r=>r.status==='recebido');
  document.getElementById('mainContent').innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;">
    ${[['Clientes',S.clients.length,'#534AB7','#EEEDFE'],['Projetos',S.projects.length,'#185FA5','#E6F1FB'],['Urgentes',urg.length,'#A32D2D','#FCEBEB'],['Solicitações',pend.length,'#854F0B','#FAEEDA']].map(([l,v,c,bg])=>`<div class="metric" style="background:${bg};"><div style="font-size:10px;color:${c};margin-bottom:3px;">${l}</div><div style="font-size:22px;font-weight:500;color:${c};">${v}</div></div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
    <div><div style="font-size:12px;font-weight:500;margin-bottom:8px;">Clientes</div>
      ${S.clients.map(c=>{const k=cc(c.id);const ps=S.projects.filter(p=>p.clientId===c.id);const avg=ps.length?Math.round(ps.reduce((a,p)=>a+p.progress,0)/ps.length):0;return`<div onclick="selClient('${c.id}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:0.5px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer;">${ava(c.initials||'?',k.color,k.bg,32)}<div style="flex:1;"><div style="font-size:12px;font-weight:500;">${c.name}</div><div style="font-size:10px;color:#999;">${ps.length} projeto(s)</div></div><div style="text-align:right;"><div style="font-size:11px;font-weight:500;">${avg}%</div><div style="width:60px;height:3px;background:rgba(0,0,0,0.1);border-radius:3px;margin-top:4px;overflow:hidden;"><div style="height:100%;width:${avg}%;background:${k.color};border-radius:3px;"></div></div></div></div>`;}).join('')}
      ${S.clients.length===0?'<div class="empty">Nenhum cliente ainda.</div>':''}
    </div>
    <div><div style="font-size:12px;font-weight:500;margin-bottom:8px;">Tarefas urgentes</div>
      ${urg.slice(0,6).map(t=>{const cl=S.clients.find(c=>c.id===t.clientId);return`<div style="display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:0.5px solid var(--border);border-radius:8px;margin-bottom:6px;"><span class="urg-dot"></span><div style="flex:1;font-size:12px;">${t.title}</div><span style="font-size:10px;color:#999;">${cl?.name||''}</span></div>`;}).join('')}
      ${urg.length===0?'<div class="empty">Nenhuma tarefa urgente</div>':''}
    </div>
  </div>

window.ftTasks=()=>{
  const fc=document.getElementById('ftC')?.value,fs=document.getElementById('ftS')?.value,fa=document.getElementById('ftA')?.value;

};

    mb.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div style="font-size:15px;font-weight:500;">Visão do cliente: ${c.name}</div><span onclick="closeModal()" style="cursor:pointer;font-size:20px;color:#999;">×</span></div>
    <div style="background:var(--purpleL);border:1px solid #AFA9EC;border-radius:8px;padding:9px 12px;margin-bottom:14px;font-size:12px;color:var(--purple);">Esta é a tela que ${c.name} vê ao entrar.</div>
    ${ps.map(p=>{const items=S.checklist.filter(ci=>ci.projectId===p.id);return`<div style="margin-bottom:12px;border:0.5px solid var(--border);border-radius:10px;overflow:hidden;"><div style="background:${k.bg};padding:9px 13px;display:flex;justify-content:space-between;"><div style="font-size:12px;font-weight:500;color:${k.color};">${p.name}</div>${pbdg(p.priority)}</div><div style="padding:10px 13px;"><div class="prog-bar"><div class="prog-fill" style="width:${p.progress||0}%;background:${k.color};"></div></div><div style="font-size:10px;color:#999;margin-bottom:8px;">${p.progress||0}%</div>${items.map(ci=>`<div style="font-size:11px;padding:3px 0;${ci.done?'color:#bbb;text-decoration:line-through;':''}">${ci.done?'✓':'○'} ${ci.label}</div>`).join('')}</div></div>`;}).join('')}`;
  }
};
window.closeModal=()=>document.getElementById('modalOv').classList.add('hidden');
window.updPOpts=()=>{const cid=document.getElementById('f-ci')?.value;const el=document.getElementById('f-pi');if(el)el.innerHTML=S.projects.filter(p=>p.clientId===cid).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');};
window.saveCl=async()=>{
  const nm=document.getElementById('f-nm')?.value.trim(),em=document.getElementById('f-em')?.value.trim(),ini=(document.getElementById('f-in')?.value.trim().toUpperCase()||nm?.slice(0,2).toUpperCase()),pw=document.getElementById('f-pw')?.value;
  if(!nm||!em)return alert('Preencha nome e e-mail.');
  const ref=await addDoc(collection(db,'clients'),{name:nm,email:em,initials:ini,createdAt:serverTimestamp()});
  if(pw){try{const r=await createUserWithEmailAndPassword(auth,em,pw);await setDoc(doc(db,'users',r.user.uid),{role:'client',clientId:ref.id,name:nm,email:em});}catch(e){alert('Cliente criado mas houve erro no login: '+e.message);}}
  closeModal();
};
window.savePr=async()=>{const nm=document.getElementById('f-nm')?.value.trim(),ci=document.getElementById('f-ci')?.value,dl=document.getElementById('f-dl')?.value,pr=document.getElementById('f-pr')?.value||'normal';if(!nm||!ci)return;await addDoc(collection(db,'projects'),{name:nm,clientId:ci,deadline:dl,priority:pr,progress:0,createdAt:serverTimestamp()});closeModal();};
window.saveTk=async id=>{const d={title:document.getElementById('f-ti')?.value.trim(),clientId:document.getElementById('f-ci')?.value,projectId:document.getElementById('f-pi')?.value,assignee:document.getElementById('f-as')?.value.trim(),deadline:document.getElementById('f-dl')?.value,status:document.getElementById('f-st')?.value||'todo',urgent:document.getElementById('f-ur')?.checked||false};if(!d.title)return;if(id)await updateDoc(doc(db,'tasks',id),d);else await addDoc(collection(db,'tasks'),{...d,createdAt:serverTimestamp()});closeModal();};
window.saveCK=async pid=>{const l=document.getElementById('f-lb')?.value.trim();if(!l)return;await addDoc(collection(db,'checklist'),{label:l,projectId:pid,done:false,order:Date.now(),createdAt:serverTimestamp()});closeModal();};
window.saveDel=async cid=>{const ti=document.getElementById('f-ti')?.value.trim(),pi=document.getElementById('f-pi')?.value,lk=document.getElementById('f-lk')?.value.trim(),dc=document.getElementById('f-dc')?.value.trim();if(!ti)return;await addDoc(collection(db,'deliveries'),{title:ti,projectId:pi,clientId:cid,link:lk,description:dc,status:'aguardando aprovação',createdAt:serverTimestamp()});closeModal();};

// ─── CLIENT PORTAL ───────────────────────────────────────
function startClient(){
  show('client');
  const cid=S.profile.clientId;
  document.getElementById('pEm').textContent=S.profile.email;
  S.unsubs.forEach(u=>u());S.unsubs=[];
  S.unsubs=[
    onSnapshot(doc(db,'clients',cid),s=>{if(s.exists()){S.cd={id:s.id,...s.data()};document.getElementById('pAv').textContent=S.cd.initials||'?';document.getElementById('pNm').textContent=S.cd.name;renderPortal();}}),
    onSnapshot(query(collection(db,'projects'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));renderPortal();}),
    onSnapshot(query(collection(db,'checklist'),orderBy('order','asc')),s=>{S.checklist=s.docs.map(d=>({id:d.id,...d.data()}));renderPortal();}),
    onSnapshot(query(collection(db,'deliveries'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));renderPortal();}),
    onSnapshot(query(collection(db,'comments'),orderBy('createdAt','asc')),s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));renderPortal();}),
    onSnapshot(query(collection(db,'requests'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));renderPortal();}),
  ];
}

window.swPTab=el=>{document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));el.classList.add('active');S.clientTab=el.dataset.ptab;renderPortal();};

function renderPortal(){
  const mc=document.getElementById('portalContent');if(!mc)return;
  const c=S.cd;if(!c)return;
  const ps=S.projects,tab=S.clientTab;
  const avg=ps.length?Math.round(ps.reduce((a,p)=>a+p.progress,0)/ps.length):0;
  const ai=S.checklist.filter(ci=>ps.find(p=>p.id===ci.projectId));
  const di=ai.filter(ci=>ci.done).length;

  if(tab==='visao'){mc.innerHTML=`<div style="background:#fff;border:0.5px solid var(--border);border-radius:14px;padding:18px 22px;margin-bottom:18px;display:flex;align-items:center;gap:14px;"><div style="width:46px;height:46px;border-radius:10px;background:var(--purpleL);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;">${c.initials||'?'}</div><div style="flex:1;"><div style="font-size:15px;font-weight:500;">Olá, ${c.name}!</div><div style="font-size:12px;color:#666;">Acompanhe seus projetos em tempo real.</div></div><div style="background:#EAF3DE;color:#3B6D11;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:500;">Tudo em andamento</div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;">${[['Projetos ativos',ps.length],['Progresso geral',avg+'%'],['Itens concluídos',di+'/'+ai.length]].map(([l,v])=>`<div style="background:#fff;border:0.5px solid var(--border);border-radius:8px;padding:12px 14px;"><div style="font-size:11px;color:#999;margin-bottom:3px;">${l}</div><div style="font-size:20px;font-weight:500;">${v}</div></div>`).join('')}</div>
    <div style="font-size:12px;font-weight:500;margin-bottom:10px;">Seus projetos</div>
    ${ps.map(p=>{const items=S.checklist.filter(ci=>ci.projectId===p.id);const op=S.openProjs[p.id];return`<div style="background:#fff;border:0.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;"><div onclick="S.openProjs['${p.id}']=!S.openProjs['${p.id}'];renderPortal()" style="display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;"><div style="flex:1;"><div style="font-size:13px;font-weight:500;">${p.name}</div><div style="font-size:10px;color:#999;">Prazo: ${p.deadline||'-'}</div></div>${pbdg(p.priority)}<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#999;"><div style="width:70px;height:3px;background:rgba(0,0,0,0.1);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${p.progress||0}%;background:var(--purple);border-radius:3px;"></div></div>${p.progress||0}%</div><span style="font-size:11px;color:#bbb;display:inline-block;transform:${op?'rotate(90deg)':'none'}">›</span></div>${op?`<div style="border-top:0.5px solid var(--border);padding:14px 16px;"><div style="font-size:10px;font-weight:500;color:#999;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Checklist</div>${items.map(ci=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12px;${ci.done?'color:#bbb;text-decoration:line-through;':''}"><div style="width:14px;height:14px;border-radius:4px;background:${ci.done?'#EAF3DE':'#f0f0f0'};border:${ci.done?'none':'0.5px solid rgba(0,0,0,0.2)'};display:flex;align-items:center;justify-content:center;font-size:9px;color:#3B6D11;">${ci.done?'✓':''}</div>${ci.label}</div>`).join('')}${items.length===0?'<div style="font-size:11px;color:#bbb;">Nenhum item ainda</div>':''}</div>`:''}`;}).join('')}
    ${ps.length===0?'<div class="empty">Nenhum projeto ativo.</div>':''}`;
  }else if(tab==='entregas'){mc.innerHTML=`<div style="font-size:12px;font-weight:500;margin-bottom:12px;">Entregas e arquivos</div>
    ${S.deliveries.map(d=>{const pr=ps.find(p=>p.id===d.projectId);const dcmts=S.comments.filter(cm=>cm.deliveryId===d.id);const op=S.openEnts[d.id];const sc=d.status==='aprovado'?['#EAF3DE','#3B6D11']:['#FAEEDA','#854F0B'];return`<div style="background:#fff;border:0.5px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;"><div onclick="S.openEnts['${d.id}']=!S.openEnts['${d.id}'];renderPortal()" style="display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;"><div style="width:34px;height:34px;border-radius:7px;background:${sc[0]};color:${sc[1]};display:flex;align-items:center;justify-content:center;font-size:14px;">${d.status==='aprovado'?'✓':'↑'}</div><div style="flex:1;"><div style="font-size:13px;font-weight:500;">${d.title}</div><div style="font-size:10px;color:#999;">${pr?.name||''}</div></div>${bdg(d.status,sc[0],sc[1])}<span style="font-size:11px;color:#bbb;display:inline-block;transform:${op?'rotate(90deg)':'none'}">›</span></div>${op?`<div style="border-top:0.5px solid var(--border);padding:14px 16px;">${d.link?`<div style="background:#f5f5f3;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;"><div style="flex:1;"><div style="font-size:12px;font-weight:500;">${d.title}</div>${d.description?`<div style="font-size:11px;color:#666;">${d.description}</div>`:''}</div><a href="${d.link}" target="_blank" style="font-size:11px;color:var(--purple);border:0.5px solid #AFA9EC;border-radius:6px;padding:4px 10px;text-decoration:none;white-space:nowrap;">Abrir arquivo ↗</a></div>`:''}<div class="cmt-thread">${dcmts.map(cm=>`<div class="cmt"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><div style="width:22px;height:22px;border-radius:50%;background:${cm.authorRole==='agency'?'#534AB7':'#EEEDFE'};color:${cm.authorRole==='agency'?'#fff':'#534AB7'};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;">${(cm.authorName||'?')[0]}</div><span style="font-size:11px;font-weight:500;">${cm.authorName}</span><span style="font-size:10px;color:#bbb;margin-left:auto;">${ft(cm.createdAt)}</span></div><div style="font-size:12px;color:#555;">${cm.text}</div></div>`).join('')}${dcmts.length===0?'<div class="empty">Sem comentários</div>':''}<div class="cmt-inp-row" style="gap:6px;"><input class="cmt-inp" id="pdc-${d.id}" placeholder="Comentar ou solicitar ajuste...">${d.status!=='aprovado'?`<button class="btn-o" onclick="approveDel('${d.id}')">Aprovar</button>`:''}<button class="btn-p" onclick="sendPDC('${d.id}')">Enviar</button></div></div></div>`:''}`;}).join('')}
    ${S.deliveries.length===0?'<div class="empty">Nenhuma entrega ainda. A agência enviará os arquivos aqui.</div>':''}`;
  }else if(tab==='solicitar'){mc.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:flex-start;">
    <div><div style="font-size:12px;font-weight:500;margin-bottom:10px;">Nova solicitação</div>
    <div style="background:#fff;border:0.5px solid var(--border);border-radius:12px;padding:18px;">
      <div class="fg"><label>Título</label><input id="ps-ti" placeholder="Ex: Banner para LinkedIn"></div>
      <div class="fg"><label>Tipo</label><select id="ps-ty">${['Design gráfico','Conteúdo / Copywriting','Social media','Campanha paga','Vídeo / Motion','Estratégia','Outro'].map(o=>`<option>${o}</option>`).join('')}</select></div>
      <div class="fg"><label>Projeto</label><select id="ps-pj"><option value="">Sem projeto específico</option>${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
      <div class="fg"><label>Prioridade</label><select id="ps-pr"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
      <div class="fg"><label>Descrição</label><textarea id="ps-dc" placeholder="Descreva o que precisa, contexto, onde será usado..."></textarea></div>
      <div class="fg"><label>Links de referência</label><input id="ps-lk" placeholder="https://... (separe por vírgula se houver vários)"></div>
      <div id="ps-ok" style="display:none;background:#EAF3DE;color:#3B6D11;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px;text-align:center;">Solicitação enviada!</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn-o" onclick="['ps-ti','ps-dc','ps-lk'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''})">Limpar</button><button class="btn-p" onclick="submitReq()">Enviar solicitação</button></div>
    </div></div>
    <div><div style="font-size:12px;font-weight:500;margin-bottom:10px;">Solicitações enviadas</div>
    ${S.requests.map(r=>`<div style="background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;margin-bottom:5px;"><div style="font-size:13px;font-weight:500;">${r.title}</div><div style="display:flex;gap:5px;">${pbdg(r.priority)}${bdg(r.status,r.status==='recebido'?'#E6F1FB':'#EAF3DE',r.status==='recebido'?'#185FA5':'#3B6D11')}</div></div><div style="font-size:11px;color:#555;">${r.description||''}</div><div style="font-size:10px;color:#bbb;margin-top:4px;">${r.type||''} · ${ft(r.createdAt)}</div></div>`).join('')}
    ${S.requests.length===0?'<div style="background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:30px;text-align:center;font-size:12px;color:#bbb;">Nenhuma solicitação ainda</div>':''}
    </div></div>`;
  }else if(tab==='comunicacao'){mc.innerHTML=`<div style="font-size:12px;font-weight:500;margin-bottom:12px;">Mensagens por projeto</div>
    ${ps.map(p=>{const pcmts=S.comments.filter(cm=>cm.projectId===p.id&&!cm.deliveryId);return`<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:500;margin-bottom:7px;">${p.name}</div><div class="cmt-thread">${pcmts.map(cm=>`<div class="cmt"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><div style="width:22px;height:22px;border-radius:50%;background:${cm.authorRole==='agency'?'#534AB7':'#EEEDFE'};color:${cm.authorRole==='agency'?'#fff':'#534AB7'};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;">${(cm.authorName||'?')[0]}</div><span style="font-size:11px;font-weight:500;">${cm.authorName}</span><span style="font-size:10px;color:#bbb;margin-left:auto;">${ft(cm.createdAt)}</span></div><div style="font-size:12px;color:#555;">${cm.text}</div></div>`).join('')}${pcmts.length===0?'<div class="empty">Sem mensagens</div>':''}<div class="cmt-inp-row"><input class="cmt-inp" id="pco-${p.id}" placeholder="Enviar mensagem..."><button class="btn-p" onclick="sendPCO('${p.id}')">Enviar</button></div></div></div>`;}).join('')}
    ${ps.length===0?'<div class="empty">Nenhum projeto ativo</div>':''}`;
  }
}

window.approveDel=async id=>{await updateDoc(doc(db,'deliveries',id),{status:'aprovado'});await addDoc(collection(db,'comments'),{deliveryId:id,text:'Entrega aprovada! ✓',authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});};
window.sendPDC=async id=>{const el=document.getElementById('pdc-'+id);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{deliveryId:id,text:t,authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});el.value='';};
window.sendPCO=async pid=>{const el=document.getElementById('pco-'+pid);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{projectId:pid,text:t,authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});el.value='';};
window.submitReq=async()=>{
  const ti=document.getElementById('ps-ti')?.value.trim(),dc=document.getElementById('ps-dc')?.value.trim();
  if(!ti||!dc)return alert('Preencha título e descrição.');
  const ty=document.getElementById('ps-ty')?.value,pj=document.getElementById('ps-pj')?.value,pr=document.getElementById('ps-pr')?.value,lk=document.getElementById('ps-lk')?.value.trim();
  const proj=S.projects.find(p=>p.id===pj);
  const fileLinks=lk?lk.split(',').map(l=>l.trim()).filter(Boolean):[];
  await addDoc(collection(db,'requests'),{title:ti,description:dc,type:ty,projectId:pj,projectName:proj?.name||'',priority:pr,fileLinks,clientId:S.profile.clientId,clientName:S.cd?.name||'',status:'recebido',createdAt:serverTimestamp()});
  ['ps-ti','ps-dc','ps-lk'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  const ok=document.getElementById('ps-ok');if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);}
};

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
</body>
