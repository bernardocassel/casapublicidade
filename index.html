<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agência Hub — Casa Publicidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f3;--bg2:#fff;--bg3:#e8e8e6;--bg4:#f0f0ee;
  --text:#1a1a1a;--text2:#555;--text3:#999;--text4:#bbb;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --purple:#534AB7;--purpleL:#EEEDFE;--purpleM:#7F77DD;
  --green:#1D9E75;--greenL:#EAF3DE;--greenD:#3B6D11;
  --red:#E24B4A;--redL:#FCEBEB;--redD:#A32D2D;
  --amber:#EF9F27;--amberL:#FAEEDA;--amberD:#854F0B;
  --blue:#378ADD;--blueL:#E6F1FB;--blueD:#185FA5;
  --shadow:rgba(0,0,0,0.06);
}
[data-theme="dark"]{
  --bg:#1a1a1f;--bg2:#252530;--bg3:#1e1e28;--bg4:#2a2a35;
  --text:#e8e8f0;--text2:#aaa;--text3:#666;--text4:#444;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --purpleL:#2a2650;--greenL:#1a2e1f;--redL:#2e1a1a;--amberL:#2e2418;--blueL:#1a2233;
  --shadow:rgba(0,0,0,0.3);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg);transition:background .2s,color .2s;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;background:var(--bg2);color:var(--text);}
.hidden{display:none!important;}

/* AUTH */
#authWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.auth-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:18px;padding:42px 38px;width:390px;max-width:92vw;}
.auth-logo{width:48px;height:48px;border-radius:12px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;margin-bottom:22px;}
.auth-err{background:var(--redL);color:var(--redD);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;}
.fl{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.fi{width:100%;border:0.5px solid var(--border2);border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:12px;outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--purple);}
.btn-auth{width:100%;background:var(--purple);color:#fff;border:none;border-radius:9px;padding:12px;font-size:13px;font-weight:600;margin-top:6px;transition:opacity .15s;}
.btn-auth:hover{opacity:.88;}

/* SHELL */
#shell{display:flex;height:100vh;overflow:hidden;}

/* SIDEBAR */
.sb{width:220px;background:var(--bg3);border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:background .2s;}
.sb-head{padding:16px 14px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;}
.sb-logo{width:32px;height:32px;border-radius:8px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.sb-title{font-size:13px;font-weight:600;}
.sb-sub{font-size:10px;color:var(--text3);margin-top:1px;}
.sb-sec{padding:10px 9px 4px;}
.sb-lbl{font-size:10px;font-weight:600;color:var(--text4);text-transform:uppercase;letter-spacing:.06em;padding:0 4px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;}
.sb-lbl button{background:none;border:none;font-size:17px;color:var(--text3);line-height:1;padding:0;cursor:pointer;}
.sb-lbl button:hover{color:var(--text);}
.nav-it{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--text2);margin-bottom:2px;transition:background .12s,color .12s;}
.nav-it:hover{background:var(--border);color:var(--text);}
.nav-it.on{background:var(--purpleL);color:var(--purple);font-weight:600;}
.nav-ico{width:16px;text-align:center;font-size:14px;flex-shrink:0;}
.cl-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px;}
.cl-it{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;margin-bottom:2px;transition:background .12s;}
.cl-it:hover{background:var(--border);}
.cl-it.on{background:var(--purpleL);}
.cl-av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.cl-nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cl-pr{font-size:10px;color:var(--text3);}
.sb-bot{margin-top:auto;padding:12px;border-top:0.5px solid var(--border);display:flex;gap:7px;}
.theme-btn{background:none;border:0.5px solid var(--border2);border-radius:7px;padding:6px 10px;font-size:14px;color:var(--text2);}
.theme-btn:hover{background:var(--border);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{padding:11px 20px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2);flex-shrink:0;}
.tb-title{font-size:15px;font-weight:600;flex:1;color:var(--text);}
.tb-title span{font-weight:400;color:var(--text3);}
.content{flex:1;overflow-y:auto;padding:20px;}

/* TABS */
.tabs{display:flex;border-bottom:0.5px solid var(--border);padding:0 20px;background:var(--bg2);flex-shrink:0;}
.tab{padding:10px 14px;font-size:12px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;transition:all .12s;font-weight:500;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--purple);border-bottom-color:var(--purple);font-weight:600;}

/* BADGES */
.bdg{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block;}
.b-urg{background:var(--redL);color:var(--redD);}
.b-alt{background:var(--amberL);color:var(--amberD);}
.b-ok{background:var(--greenL);color:var(--greenD);}
.b-inf{background:var(--blueL);color:var(--blueD);}
.b-gray{background:var(--bg4);color:var(--text2);}

/* METRICS */
.met-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.met{border-radius:12px;padding:14px 16px;}
.met-l{font-size:10px;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.met-v{font-size:26px;font-weight:700;}

/* THERMOMETER */
.therm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:18px;}
.therm-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;}
.therm-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.therm-name{font-size:13px;font-weight:600;flex:1;}
.therm-score{font-size:20px;font-weight:700;}
.therm-bar-bg{height:8px;background:var(--bg3);border-radius:8px;overflow:hidden;margin-bottom:5px;}
.therm-bar-fill{height:100%;border-radius:8px;transition:width .5s;}
.therm-label{font-size:10px;color:var(--text3);}

/* CHARTS */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.chart-box{background:var(--bg4);border-radius:12px;padding:14px;}
.chart-box-t{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}

/* CARDS */
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:13px;padding:14px;transition:border-color .12s;}
.card:hover{border-color:var(--border2);}
.card.sel{border:2px solid var(--purple);}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:16px;}
.prog{height:5px;background:var(--bg3);border-radius:5px;overflow:hidden;margin:9px 0 5px;}
.prog-f{height:100%;border-radius:5px;transition:width .4s;}

/* FRENTES */
.frente-card{background:var(--bg4);border:0.5px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
.frente-head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;}
.frente-head:hover{background:var(--border);}
.frente-body{border-top:0.5px solid var(--border);padding:12px 13px;}
.frente-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;}
.kc{background:var(--bg4);border-radius:11px;padding:10px;}
.kc-h{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.kc-n{background:var(--bg2);border:0.5px solid var(--border);width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
.kcard{background:var(--bg2);border:0.5px solid var(--border);border-radius:9px;padding:10px;margin-bottom:7px;cursor:pointer;transition:border-color .12s;}
.kcard:hover{border-color:var(--border2);}
.kcard-t{font-size:12px;font-weight:600;margin-bottom:6px;line-height:1.35;color:var(--text);}
.kcard-fr{font-size:10px;color:var(--text3);margin-bottom:5px;}
.kcard-m{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--text2);}
.udot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-right:4px;vertical-align:middle;}
.avatar-sm{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:12px;}
.tbl th{text-align:left;font-size:10px;font-weight:700;color:var(--text3);padding:7px 10px;border-bottom:0.5px solid var(--border);text-transform:uppercase;letter-spacing:.04em;}
.tbl td{padding:10px 10px;border-bottom:0.5px solid var(--border);vertical-align:middle;color:var(--text);}
.tbl tr:hover td{background:var(--bg4);}

/* CHECKLIST */
.ck-list{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;}
.ck-it{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:0.5px solid var(--border);font-size:12px;color:var(--text);}
.ck-it:last-child{border:none;}
.ck-it.done span{text-decoration:line-through;color:var(--text3);}
.ck-it input{accent-color:var(--purple);cursor:pointer;width:15px;height:15px;}

/* COMMENTS */
.cmt-box{border:0.5px solid var(--border);border-radius:11px;overflow:hidden;}
.cmt{padding:11px 14px;border-bottom:0.5px solid var(--border);}
.cmt:last-child{border:none;}
.cmt-h{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.cmt-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
.cmt-au{font-size:12px;font-weight:600;color:var(--text);}
.cmt-tm{font-size:10px;color:var(--text4);margin-left:auto;}
.cmt-tx{font-size:12px;color:var(--text2);line-height:1.55;}
.inp-row{display:flex;gap:8px;padding:10px 14px;background:var(--bg3);}
.cmt-inp{flex:1;font-size:12px;border:0.5px solid var(--border2);border-radius:9px;padding:7px 10px;outline:none;transition:border-color .15s;}
.cmt-inp:focus{border-color:var(--purple);}

/* DELIVERIES */
.del-it{background:var(--bg2);border:0.5px solid var(--border);border-radius:11px;margin-bottom:10px;overflow:hidden;}
.del-h{display:flex;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;}
.del-h:hover{background:var(--bg3);}
.del-body{border-top:0.5px solid var(--border);padding:14px 15px;}

/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:400;}
.mbox{background:var(--bg2);border-radius:18px;border:0.5px solid var(--border);width:420px;max-width:93vw;max-height:90vh;overflow-y:auto;padding:24px;}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.mt{font-size:16px;font-weight:700;color:var(--text);}
.mx{cursor:pointer;font-size:24px;color:var(--text3);line-height:1;background:none;border:none;padding:0;}
.fg{margin-bottom:13px;}
.fg label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.fg input,.fg select,.fg textarea{width:100%;border:0.5px solid var(--border2);border-radius:9px;padding:8px 11px;font-size:13px;outline:none;transition:border-color .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--purple);}
.fg textarea{min-height:76px;resize:vertical;}
.mft{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}

/* BUTTONS */
.bp{font-size:12px;padding:7px 16px;border-radius:9px;border:none;background:var(--purple);color:#fff;font-weight:600;transition:opacity .15s;}
.bp:hover{opacity:.85;}
.bo{font-size:12px;padding:7px 16px;border-radius:9px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-weight:500;}
.bo:hover{background:var(--bg3);}
.bsm{font-size:11px;padding:4px 11px;border-radius:7px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);}
.bsm:hover{background:var(--bg3);}

/* FILTER */
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.fbar select{font-size:12px;padding:6px 9px;border:0.5px solid var(--border2);border-radius:9px;background:var(--bg2);color:var(--text);outline:none;}

/* RATING STARS */
.stars{display:flex;gap:4px;}
.star{font-size:22px;cursor:pointer;line-height:1;transition:transform .1s;}
.star:hover{transform:scale(1.2);}

/* PORTAL */
#portal{min-height:100vh;background:var(--bg);}
.pnav{background:var(--bg2);border-bottom:0.5px solid var(--border);padding:0 24px;display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.plogo{display:flex;align-items:center;gap:10px;padding:13px 22px 13px 0;margin-right:22px;border-right:0.5px solid var(--border);}
.ptabs{display:flex;flex:1;}
.ptab{padding:14px 14px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-.5px;white-space:nowrap;transition:all .12s;font-weight:500;}
.ptab:hover{color:var(--text);}
.ptab.on{color:var(--purple);border-bottom-color:var(--purple);font-weight:700;}
.ptab .ndot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;margin-left:4px;vertical-align:middle;}
.puser{display:flex;align-items:center;gap:9px;padding:9px 0;margin-left:auto;}
.pbody{padding:24px;max-width:960px;margin:0 auto;}
.hero{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:22px 26px;margin-bottom:20px;display:flex;align-items:center;gap:16px;}

/* PORTAL METRICS */
.pmet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
.pmet{background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;}
.pmet-l{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:600;}
.pmet-v{font-size:22px;font-weight:700;color:var(--text);}
.pmet-bar{height:4px;background:var(--bg3);border-radius:4px;margin-top:8px;overflow:hidden;}
.pmet-fill{height:100%;border-radius:4px;}

.empty{text-align:center;padding:36px;color:var(--text3);font-size:12px;}
.sec-t{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text);}
</style>
</head>
<body>

<div id="authWrap">
  <div class="auth-box">
    <div class="auth-logo">AH</div>
    <div style="font-size:22px;font-weight:700;margin-bottom:4px;color:var(--text);">Agência Hub</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:26px;">Casa Publicidade — acesse sua conta</div>
    <div class="auth-err hidden" id="authErr"></div>
    <label class="fl">E-mail</label>
    <input class="fi" id="aEmail" type="email" placeholder="seu@email.com">
    <label class="fl">Senha</label>
    <input class="fi" id="aPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <button class="btn-auth" onclick="login()">Entrar</button>
  </div>
</div>

<div id="shell" class="hidden">
  <div class="sb">
    <div class="sb-head">
      <div class="sb-logo">AH</div>
      <div><div class="sb-title">Agência Hub</div><div class="sb-sub">Painel interno</div></div>
    </div>
    <div class="sb-sec">
      <div class="sb-lbl">Menu</div>
      <div class="nav-it on" id="nv-dashboard" onclick="gv('dashboard')"><span class="nav-ico">⊞</span>Dashboard</div>
      <div class="nav-it" id="nv-all-tasks" onclick="gv('all-tasks')"><span class="nav-ico">✓</span>Todas as tarefas</div>
      <div class="nav-it" id="nv-team" onclick="gv('team')"><span class="nav-ico">◎</span>Equipe</div>
    </div>
    <div class="sb-sec">
      <div class="sb-lbl">Clientes <button onclick="om('client',{})">+</button></div>
    </div>
    <div class="cl-scroll" id="clList"></div>
    <div class="sb-bot">
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="Alternar tema">☀️</button>
      <button class="bo" style="flex:1;font-size:11px;" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="tb-title" id="tbT">Dashboard</div>
      <div id="tbA"></div>
    </div>
    <div class="tabs hidden" id="clTabs">
      <div class="tab on" data-t="projetos" onclick="st(this)">Projetos</div>
      <div class="tab" data-t="kanban" onclick="st(this)">Kanban</div>
      <div class="tab" data-t="checklist" onclick="st(this)">Checklist</div>
      <div class="tab" data-t="entregas" onclick="st(this)">Entregas</div>
      <div class="tab" data-t="comentarios" onclick="st(this)">Comentários</div>
      <div class="tab" data-t="solicitacoes" onclick="st(this)">Solicitações</div>
    </div>
    <div class="content" id="mc"></div>
  </div>
</div>

<div id="portal" class="hidden">
  <div class="pnav">
    <div class="plogo">
      <div style="width:32px;height:32px;border-radius:8px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">AH</div>
      <div><div style="font-size:13px;font-weight:700;color:var(--text);">Agência Hub</div><div style="font-size:10px;color:var(--text3);">Portal do cliente</div></div>
    </div>
    <div class="ptabs">
      <div class="ptab on" data-p="visao" onclick="spt(this)">Visão geral</div>
      <div class="ptab" data-p="projetos" onclick="spt(this)">Projetos</div>
      <div class="ptab" data-p="entregas" onclick="spt(this)">Entregas<span class="ndot"></span></div>
      <div class="ptab" data-p="solicitar" onclick="spt(this)">Solicitar</div>
      <div class="ptab" data-p="comunicacao" onclick="spt(this)">Comunicação</div>
      <div class="ptab" data-p="avaliar" onclick="spt(this)">Avaliar</div>
    </div>
    <div class="puser">
      <button class="theme-btn" onclick="toggleTheme()">☀️</button>
      <div id="pAv" style="width:30px;height:30px;border-radius:50%;background:var(--purpleL);color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;">?</div>
      <div><div id="pNm" style="font-size:12px;font-weight:700;color:var(--text);"></div><div id="pEm" style="font-size:10px;color:var(--text3);"></div></div>
      <button class="bo" style="font-size:11px;padding:5px 11px;margin-left:8px;" onclick="logout()">Sair</button>
    </div>
  </div>
  <div class="pbody" id="pc"></div>
</div>

<div class="mov hidden" id="mov" onclick="if(event.target===this)cm()">
  <div class="mbox" id="mb"></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,updateDoc,onSnapshot,query,where,orderBy,serverTimestamp,getDoc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// AUTH
window.login=async()=>{
  const e=$('aEmail').value.trim(),p=$('aPass').value;
  const err=$('authErr');err.classList.add('hidden');
  try{await signInWithEmailAndPassword(auth,e,p);}
  catch{err.textContent='E-mail ou senha incorretos.';err.classList.remove('hidden');}

window.logout=async()=>{S.unsubs.forEach(u=>u());S.unsubs=[];await signOut(auth);show('authWrap');};

onAuthStateChanged(auth,async u=>{
  if(!u){show('authWrap');return;}
  const snap=await getDoc(doc(db,'users',u.uid));
  if(!snap.exists()){show('authWrap');$('authErr').textContent='Usuário não configurado.';$('authErr').classList.remove('hidden');await signOut(auth);return;}
  S.profile={uid:u.uid,email:u.email,...snap.data()};
  S.profile.role==='agency'||S.profile.role==='team'?startAgency():startPortal();
});

// AGENCY
function startAgency(){
  show('shell');S.unsubs.forEach(u=>u());S.unsubs=[];
  S.unsubs=[
    onSnapshot(query(collection(db,'clients'),orderBy('createdAt','desc')),s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));renderCL();rv();}),
    onSnapshot(query(collection(db,'projects'),orderBy('createdAt','desc')),s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'frentes'),orderBy('createdAt','desc')),s=>{S.frentes=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'tasks'),orderBy('createdAt','desc')),s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'checklist'),orderBy('order','asc')),s=>{S.checklist=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'comments'),orderBy('createdAt','asc')),s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'deliveries'),orderBy('createdAt','desc')),s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'requests'),orderBy('createdAt','desc')),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'ratings'),orderBy('createdAt','desc')),s=>{S.ratings=s.docs.map(d=>({id:d.id,...d.data()}));rv();}),
    onSnapshot(query(collection(db,'users')),s=>{S.team=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role==='team');rv();}),
  ];
}

function rv(){

  if(S.view==='dashboard'){ti.innerHTML='Dashboard';ac.innerHTML=`<button class="bp" onclick="om('client',{})">+ Cliente</button>`;renderDash();}

  else if(S.view==='team'){ti.innerHTML='Equipe';ac.innerHTML=`<button class="bp" onclick="om('team-member',{})">+ Membro</button>`;renderTeam();}
  else if(S.view==='client'){const c=S.clients.find(x=>x.id===S.acl);if(!c)return;ti.innerHTML=`<span>Clientes / </span>${c.name}`;ac.innerHTML=`<button class="bo" style="margin-right:8px;" onclick="om('cview',{})">👁 Ver como cliente</button><button class="bp" onclick="om('proj',{clientId:'${c.id}'})">+ Projeto</button>`;renderCV();}
}

// CLIENT SATISFACTION SCORE
function clientScore(clientId){
  const rs=S.ratings.filter(r=>r.clientId===clientId);
  if(!rs.length)return null;
  const avg=rs.reduce((a,r)=>a+r.score,0)/rs.length;
  return Math.round(avg);
}

  $('mc').innerHTML=`<div class="fbar">

window.ftT=()=>{
  const fc=$('ftC')?.value,fs=$('ftS')?.value,fa=$('ftA')?.value;
  let t=S.tasks;if(fc)t=t.filter(x=>x.clientId===fc);if(fs)t=t.filter(x=>x.status===fs);if(fa)t=t.filter(x=>x.assignee===fa);
  const el=$('ttbl');if(!el)return;
  if(!t.length){el.innerHTML='<div class="empty">Nenhuma tarefa encontrada.</div>';return;}
  el.innerHTML=`<table class="tbl"><thead><tr>${['Tarefa','Cliente','Projeto','Frente','Responsável','Status','Prazo',''].map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>
  ${t.map(x=>{const cl=S.clients.find(c=>c.id===x.clientId);const pr=S.projects.find(p=>p.id===x.projectId);const fr=S.frentes.find(f=>f.id===x.frenteId);const k=cl?cc(cl.id):{color:'#666',bg:'#eee'};return`<tr>
    <td style="font-weight:600;">${x.urgent?'<span class="udot"></span>':''}${x.title}</td>
    <td>${cl?`<span style="background:${k.bg};color:${k.color};padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;">${cl.name}</span>`:''}</td>
    <td style="color:var(--text2);">${pr?.name||''}</td>
    <td style="color:var(--text2);">${fr?`${FRENTE_ICONS[fr.type]||'📁'} ${fr.name}`:'—'}</td>
    <td>${x.assignee||'—'}</td><td>${sb(x.status)}</td><td style="color:var(--text3);">${x.deadline||''}</td>
    <td><button class="bsm" onclick='om("task",${JSON.stringify(x).replace(/'/g,"&#39;")})'>Editar</button></td>
  </tr>`;}).join('')}</tbody></table>`;
};

    ${assignees.map((a,i)=>{const mt=S.tasks.filter(t=>t.assignee===a);const doing=mt.filter(t=>t.status==='doing').length;const done=mt.filter(t=>t.status==='done').length;const urg=mt.filter(t=>t.urgent&&t.status!=='done').length;return`<div class="card" style="cursor:default;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">${av(a[0],CC[i%CC.length],CB[i%CB.length],38)}<div><div style="font-size:13px;font-weight:700;color:var(--text);">${a}</div><div style="font-size:10px;color:var(--text3);">${mt.length} tarefas</div></div></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;">
        <div style="background:var(--blueL);border-radius:8px;padding:8px;"><div style="font-size:18px;font-weight:700;color:var(--blueD);">${doing}</div><div style="font-size:9px;color:var(--blueD);font-weight:600;">Em andamento</div></div>
        <div style="background:var(--redL);border-radius:8px;padding:8px;"><div style="font-size:18px;font-weight:700;color:var(--redD);">${urg}</div><div style="font-size:9px;color:var(--redD);font-weight:600;">Urgentes</div></div>
        <div style="background:var(--greenL);border-radius:8px;padding:8px;"><div style="font-size:18px;font-weight:700;color:var(--greenD);">${done}</div><div style="font-size:9px;color:var(--greenD);font-weight:600;">Concluídas</div></div>
      </div>
    </div>`;}).join('')}
    ${assignees.length===0?'<div class="empty" style="grid-column:1/-1;">Nenhum responsável cadastrado ainda.</div>':''}
  </div>`;
}

// CLIENT VIEW
function renderCV(){
  const client=S.clients.find(c=>c.id===S.acl);if(!client)return;
  const mc=$('mc'),tab=S.atab,ps=S.projects.filter(p=>p.clientId===S.acl),k=cc(client.id);

  if(tab==='projetos'){
    mc.innerHTML=`<div class="proj-grid">${ps.map(p=>`
      <div class="card ${S.aproj===p.id?'sel':''}" onclick="S.aproj=S.aproj==='${p.id}'?null:'${p.id}';rv()">
        <div style="display:flex;justify-content:space-between;margin-bottom:9px;"><div><div style="font-size:13px;font-weight:700;color:var(--text);">${p.name}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">Prazo: ${p.deadline||'—'}</div></div>${pb(p.priority)}</div>
        <div class="prog"><div class="prog-f" style="width:${p.progress||0}%;background:${k.color};"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);"><span>${p.progress||0}% concluído</span><span>${S.tasks.filter(t=>t.projectId===p.id&&t.status!=='done').length} pendentes</span></div>
      </div>`).join('')}

  }else if(tab==='kanban'){

      <span style="font-size:12px;color:var(--text2);font-weight:600;">Projeto:</span>
      <select style="font-size:12px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:9px;background:var(--bg2);color:var(--text);outline:none;" onchange="S.aproj=this.value||null;rv()"><option value="">Todos</option>${ps.map(p=>`<option value="${p.id}" ${S.aproj===p.id?'selected':''}>${p.name}</option>`).join('')}</select>
    </div>
    <div class="kanban">${['todo','doing','review','done'].map(st=>{
      const ft=allTasks.filter(t=>t.status===st);
      return`<div class="kc"><div class="kc-h">${SL[st]}<span class="kc-n">${ft.length}</span></div>
      ${ft.map(t=>{const pr=S.projects.find(p=>p.id===t.projectId);const fr=S.frentes.find(f=>f.id===t.frenteId);return`<div class="kcard">
        <div class="kcard-t">${t.urgent?'<span class="udot"></span>':''}${t.title}</div>
        ${fr?`<div class="kcard-fr">${FRENTE_ICONS[fr.type]||'📁'} ${fr.name}</div>`:''}
        ${pr&&!S.aproj?`<div style="font-size:9px;color:var(--text4);margin-bottom:4px;">${pr.name}</div>`:''}
        <div class="kcard-m"><span style="display:flex;align-items:center;gap:4px;">${t.assignee?`<div class="avatar-sm" style="background:${k.bg};color:${k.color};">${t.assignee[0]}</div>${t.assignee}`:'-'}</span><span>${t.deadline||''}</span></div>
      </div>`;}).join('')}</div>`;
    }).join('')}</div>`;

  }else if(tab==='checklist'){
    mc.innerHTML=ps.map(p=>{const items=S.checklist.filter(c=>c.projectId===p.id);return`<div style="margin-bottom:18px;"><div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;"><span style="font-size:14px;font-weight:700;color:var(--text);">${p.name}</span>${pb(p.priority)}<button class="bsm" style="margin-left:auto;" onclick="om('cl',{projectId:'${p.id}'})">+ Item</button></div><div class="ck-list">${items.map(i=>`<div class="ck-it ${i.done?'done':''}"><input type="checkbox" ${i.done?'checked':''} onchange="togCk('${i.id}','${p.id}',this.checked)"><span>${i.label}</span></div>`).join('')}${items.length===0?'<div class="empty">Nenhum item. Clique em "+ Item".</div>':''}</div></div>`;}).join('');

  }else if(tab==='entregas'){
    const dels=S.deliveries.filter(d=>d.clientId===S.acl);
    mc.innerHTML=`<div style="display:flex;justify-content:flex-end;margin-bottom:12px;"><button class="bp" onclick="om('del',{clientId:'${S.acl}'})">+ Adicionar entrega</button></div>
    ${dels.map(d=>{const pr=S.projects.find(p=>p.id===d.projectId);const dcmts=S.comments.filter(c=>c.deliveryId===d.id);const op=S.oe[d.id];const sc=d.status==='aprovado'?['var(--greenL)','var(--greenD)']:['var(--amberL)','var(--amberD)'];return`<div class="del-it"><div class="del-h" onclick="S.oe['${d.id}']=!S.oe['${d.id}'];rv()">
      <div style="width:36px;height:36px;border-radius:9px;background:${sc[0]};color:${sc[1]};display:flex;align-items:center;justify-content:center;font-size:15px;">${d.status==='aprovado'?'✓':'↑'}</div>
      <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--text);">${d.title}</div><div style="font-size:10px;color:var(--text3);">${pr?.name||''}</div></div>
      ${bdg(d.status,sc[0],sc[1])}<span style="font-size:13px;color:var(--text4);margin-left:9px;display:inline-block;transform:${op?'rotate(90deg)':'none'};">›</span>
    </div>${op?`<div class="del-body">${d.link?`<div style="background:var(--bg3);border-radius:9px;padding:11px 14px;margin-bottom:13px;display:flex;align-items:center;gap:10px;"><div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--text);">${d.title}</div>${d.description?`<div style="font-size:11px;color:var(--text2);margin-top:2px;">${d.description}</div>`:''}</div><a href="${d.link}" target="_blank" style="font-size:12px;color:var(--purple);border:0.5px solid var(--purple);border-radius:7px;padding:5px 12px;text-decoration:none;font-weight:600;">Abrir arquivo ↗</a></div>`:''}<div class="cmt-box">${dcmts.map(cm=>`<div class="cmt"><div class="cmt-h"><div class="cmt-av" style="background:${cm.authorRole==='agency'?'var(--purple)':'var(--purpleL)'};color:${cm.authorRole==='agency'?'#fff':'var(--purple)'};">${(cm.authorName||'?')[0]}</div><span class="cmt-au">${cm.authorName}</span><span class="cmt-tm">${ft(cm.createdAt)}</span></div><div class="cmt-tx">${cm.text}</div></div>`).join('')}${dcmts.length===0?'<div class="empty">Sem comentários ainda</div>':''}<div class="inp-row"><input class="cmt-inp" id="dc-${d.id}" placeholder="Comentar..."><button class="bp" onclick="sendDC('${d.id}')">Enviar</button></div></div></div>`:''}
    </div>`;}).join('')}${dels.length===0?'<div class="empty">Nenhuma entrega cadastrada ainda</div>':''}`;

  }else if(tab==='comentarios'){
    mc.innerHTML=`<div style="margin-bottom:12px;"><select style="font-size:12px;padding:6px 10px;border:0.5px solid var(--border2);border-radius:9px;background:var(--bg2);color:var(--text);outline:none;" onchange="S.aproj=this.value||null;rv()"><option value="">Selecione projeto...</option>${ps.map(p=>`<option value="${p.id}" ${S.aproj===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div>
    ${S.aproj?`<div class="cmt-box">${S.comments.filter(c=>c.projectId===S.aproj&&!c.deliveryId).map(cm=>`<div class="cmt"><div class="cmt-h"><div class="cmt-av" style="background:var(--purple);color:#fff;">${(cm.authorName||'?')[0]}</div><span class="cmt-au">${cm.authorName}</span><span class="cmt-tm">${ft(cm.createdAt)}</span></div><div class="cmt-tx">${cm.text}</div></div>`).join('')}<div class="inp-row"><input class="cmt-inp" id="pjcmt" placeholder="Adicionar comentário..."><button class="bp" onclick="sendPC('${S.aproj}')">Enviar</button></div></div>`:'<div class="empty">Selecione um projeto para ver comentários</div>'}`;

  }else if(tab==='solicitacoes'){
    const reqs=S.requests.filter(r=>r.clientId===S.acl);
    mc.innerHTML=`${reqs.map(r=>`<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;"><div style="display:flex;justify-content:space-between;margin-bottom:6px;"><div><div style="font-size:13px;font-weight:700;color:var(--text);">${r.title}</div><div style="font-size:11px;color:var(--text2);">${r.type||''} · ${r.projectName||''}</div></div><div style="display:flex;gap:5px;">${pb(r.priority)}${bdg(r.status,r.status==='recebido'?'var(--blueL)':'var(--greenL)',r.status==='recebido'?'var(--blueD)':'var(--greenD)')}</div></div><div style="font-size:12px;color:var(--text2);">${r.description||''}</div>${r.fileLinks?.length?`<div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;">${r.fileLinks.map((l,i)=>`<a href="${l}" target="_blank" style="font-size:11px;background:var(--blueL);color:var(--blueD);padding:3px 9px;border-radius:4px;text-decoration:none;font-weight:600;">Ref. ${i+1} ↗</a>`).join('')}</div>`:''}<${r.status==='recebido'?`button class="bp" style="margin-top:9px;font-size:11px;" onclick="updateDoc(doc(db,'requests','${r.id}'),{status:'em andamento'})">Iniciar</button`:'span'}/></div>`).join('')}
    ${reqs.length===0?'<div class="empty">Nenhuma solicitação deste cliente</div>':''}`;
  }
}

function renderPD(client,k){
  const p=S.projects.find(x=>x.id===S.aproj);if(!p)return'';
  const frentes=S.frentes.filter(f=>f.projectId===S.aproj);
  const pt=S.tasks.filter(t=>t.projectId===S.aproj);
  return`<div style="margin-top:18px;border-top:0.5px solid var(--border);padding-top:18px;">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">
      <span style="font-size:15px;font-weight:700;color:var(--text);flex:1;">${p.name}</span>
      <button class="bo" onclick="om('del',{clientId:'${S.acl}',projectId:'${p.id}'})">+ Entrega</button>
      <button class="bo" onclick="om('frente',{projectId:'${p.id}',clientId:'${S.acl}'})">+ Frente</button>
      <button class="bp" onclick="om('task',{clientId:'${S.acl}',projectId:'${p.id}'})">+ Tarefa</button>
    </div>
    ${frentes.length>0?`<div style="margin-bottom:16px;">${frentes.map(fr=>{
      const fTasks=S.tasks.filter(t=>t.frenteId===fr.id);
      const doneF=fTasks.filter(t=>t.status==='done').length;
      const isOpen=S.of[fr.id];
      return`<div class="frente-card">
        <div class="frente-head" onclick="S.of['${fr.id}']=!S.of['${fr.id}'];rv()">
          <div class="frente-icon" style="background:var(--purpleL);color:var(--purple);">${FRENTE_ICONS[fr.type]||'📁'}</div>
          <div style="flex:1;"><div style="font-size:13px;font-weight:700;color:var(--text);">${fr.name}</div><div style="font-size:10px;color:var(--text3);">${fr.type} · ${doneF}/${fTasks.length} tarefas</div></div>
          ${pb(fr.priority||'normal')}
          <button class="bsm" style="margin-right:8px;" onclick="event.stopPropagation();om('task',{clientId:'${S.acl}',projectId:'${p.id}',frenteId:'${fr.id}'})">+ Tarefa</button>
          <span style="font-size:13px;color:var(--text4);display:inline-block;transform:${isOpen?'rotate(90deg)':'none'};">›</span>
        </div>
        ${isOpen?`<div class="frente-body"><div class="kanban">${['todo','doing','review','done'].map(st=>`<div class="kc"><div class="kc-h">${SL[st]}<span class="kc-n">${fTasks.filter(t=>t.status===st).length}</span></div>${fTasks.filter(t=>t.status===st).map(t=>`<div class="kcard"><div class="kcard-t">${t.urgent?'<span class="udot"></span>':''}${t.title}</div><div class="kcard-m"><span style="display:flex;align-items:center;gap:4px;">${t.assignee?`<div class="avatar-sm" style="background:${k.bg};color:${k.color};">${t.assignee[0]}</div>${t.assignee}`:'-'}</span><span>${t.deadline||''}</span></div><select style="font-size:10px;margin-top:5px;width:100%;border:0.5px solid var(--border2);border-radius:5px;padding:2px 5px;background:var(--bg3);color:var(--text);" onchange="updateDoc(doc(db,'tasks','${t.id}'),{status:this.value})">${Object.entries(SL).map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div></div>`:''}
      </div>`;
    }).join('')}</div>`:''}
    ${frentes.length===0?`<div style="margin-bottom:14px;"><div class="kanban">${['todo','doing','review','done'].map(st=>`<div class="kc"><div class="kc-h">${SL[st]}<span class="kc-n">${pt.filter(t=>t.status===st).length}</span></div>${pt.filter(t=>t.status===st&&!t.frenteId).map(t=>`<div class="kcard"><div class="kcard-t">${t.urgent?'<span class="udot"></span>':''}${t.title}</div><div class="kcard-m"><span>${t.assignee||'-'}</span><span>${t.deadline||''}</span></div><select style="font-size:10px;margin-top:5px;width:100%;border:0.5px solid var(--border2);border-radius:5px;padding:2px 5px;background:var(--bg3);color:var(--text);" onchange="updateDoc(doc(db,'tasks','${t.id}'),{status:this.value})">${Object.entries(SL).map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div></div>`:''}
  </div>`;
}

// ACTIONS
window.togCk=async(id,pjId,val)=>{await updateDoc(doc(db,'checklist',id),{done:val});const items=S.checklist.filter(c=>c.projectId===pjId);const done=items.filter(c=>c.id===id?val:c.done).length;await updateDoc(doc(db,'projects',pjId),{progress:items.length?Math.round(done/items.length*100):0});};
window.updateDoc=(ref,data)=>import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js").then(m=>m.updateDoc(ref,data));
window.sendPC=async pjId=>{const el=$('pjcmt');const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{projectId:pjId,text:t,authorName:'Agência Hub',authorRole:'agency',createdAt:serverTimestamp()});el.value='';};
window.sendDC=async dId=>{const el=$('dc-'+dId);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{deliveryId:dId,text:t,authorName:'Agência Hub',authorRole:'agency',createdAt:serverTimestamp()});el.value='';};

// MODALS
window.om=(type,data)=>{
  const ov=$('mov'),mb=$('mb');ov.classList.remove('hidden');

  const fi=(id,type,val,ph)=>`<input id="${id}" type="${type||'text'}" value="${val||''}" placeholder="${ph||''}">`;
  const fs=(id,opts,sel)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${sel===v?'selected':''}>${l}</option>`).join('')}</select>`;

  }else if(type==='team-member'){
    mb.innerHTML=`<div class="mh"><div class="mt">Adicionar membro da equipe</div><button class="mx" onclick="cm()">×</button></div>
    ${fg('Nome',fi('f-nm','text','','Nome completo'))}
    ${fg('E-mail',fi('f-em','email','','membro@agencia.com'))}
    ${fg('Senha',`<input id="f-pw" type="password" placeholder="Mín. 6 caracteres">`)}
    <div class="mft"><button class="bo" onclick="cm()">Cancelar</button><button class="bp" onclick="saveTeamMember()">Adicionar</button></div>`;
  }else if(type==='proj'){
    mb.innerHTML=`<div class="mh"><div class="mt">Novo projeto</div><button class="mx" onclick="cm()">×</button></div>
    ${fg('Nome',fi('f-nm','text',data.name,'Ex: Campanha Natal'))}
    ${fg('Cliente',fs('f-ci',S.clients.map(c=>[c.id,c.name]),data.clientId||S.acl))}
    ${fg('Prazo',fi('f-dl','date',data.deadline,''))}
    ${fg('Prioridade',fs('f-pr',[['normal','Normal'],['alta','Alta'],['urgente','Urgente']],data.priority||'normal'))}
    <div class="mft"><button class="bo" onclick="cm()">Cancelar</button><button class="bp" onclick="savePr('${data.id||''}')">Salvar</button></div>`;
  }else if(type==='frente'){
    mb.innerHTML=`<div class="mh"><div class="mt">Nova frente de trabalho</div><button class="mx" onclick="cm()">×</button></div>
    ${fg('Nome da frente',fi('f-nm','text','','Ex: Social Media Q2'))}
    ${fg('Tipo',fs('f-tp',FRENTE_TYPES.map(t=>[t,`${FRENTE_ICONS[t]} ${t}`]),'Social Media'))}
    ${fg('Prioridade',fs('f-pr',[['normal','Normal'],['alta','Alta'],['urgente','Urgente']],'normal'))}
    <div class="mft"><button class="bo" onclick="cm()">Cancelar</button><button class="bp" onclick="saveFr('${data.projectId}','${data.clientId||S.acl}')">Criar frente</button></div>`;
  }else if(type==='task'){
    const clientId=data.clientId||S.acl||'';
    const frentesOpts=S.frentes.filter(f=>f.projectId===data.projectId).map(f=>[f.id,`${FRENTE_ICONS[f.type]||'📁'} ${f.name}`]);
    mb.innerHTML=`<div class="mh"><div class="mt">${data.id?'Editar':'Nova'} tarefa</div><button class="mx" onclick="cm()">×</button></div>
    ${fg('Título',fi('f-ti','text',data.title,'Ex: Criar banner'))}
    ${fg('Cliente',`<select id="f-ci" onchange="updPO()">${S.clients.map(c=>`<option value="${c.id}" ${clientId===c.id?'selected':''}>${c.name}</option>`).join('')}</select>`)}
    ${fg('Projeto',`<select id="f-pi" onchange="updFO()">${S.projects.filter(p=>p.clientId===clientId).map(p=>`<option value="${p.id}" ${data.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}</select>`)}
    ${fg('Frente (opcional)',`<select id="f-fr"><option value="">Sem frente</option>${frentesOpts.map(([v,l])=>`<option value="${v}" ${data.frenteId===v?'selected':''}>${l}</option>`).join('')}</select>`)}
    ${fg('Responsável',fi('f-as','text',data.assignee,'Nome do responsável'))}
    ${fg('Prazo',fi('f-dl','date',data.deadline,''))}
    ${fg('Status',fs('f-st',Object.entries(SL),data.status||'todo'))}
    <div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="f-ur" ${data.urgent?'checked':''} style="accent-color:var(--purple);width:16px;height:16px;">Marcar como urgente</label></div>
    <div class="mft"><button class="bo" onclick="cm()">Cancelar</button><button class="bp" onclick="saveTk('${data.id||''}')">Salvar</button></div>`;
  }else if(type==='cl'){
    mb.innerHTML=`<div class="mh"><div class="mt">Novo item de checklist</div><button class="mx" onclick="cm()">×</button></div>
    ${fg('Descrição',fi('f-lb','text','','Ex: Briefing aprovado'))}
    <div class="mft"><button class="bo" onclick="cm()">Cancelar</button><button class="bp" onclick="saveCK('${data.projectId}')">Salvar</button></div>`;
  }else if(type==='del'){
    mb.innerHTML=`<div class="mh"><div class="mt">Nova entrega</div><button class="mx" onclick="cm()">×</button></div>
    ${fg('Título',fi('f-ti','text','','Ex: Moodboard v1'))}
    ${fg('Projeto',`<select id="f-pi">${S.projects.filter(p=>p.clientId===(data.clientId||S.acl)).map(p=>`<option value="${p.id}" ${data.projectId===p.id?'selected':''}>${p.name}</option>`).join('')}</select>`)}

function startPortal(){
  show('portal');
  const cid=S.profile.clientId;
  $('pEm').textContent=S.profile.email||'';
  S.unsubs.forEach(u=>u());S.unsubs=[];
  if(!cid){$('pc').innerHTML='<div class="empty" style="padding:60px;">Conta não configurada. Contate a agência.</div>';return;}
  S.unsubs=[
    onSnapshot(doc(db,'clients',cid),s=>{if(s.exists()){S.cd={id:s.id,...s.data()};$('pAv').textContent=S.cd.initials||'?';$('pNm').textContent=S.cd.name||'';rp();}}),
    onSnapshot(query(collection(db,'projects'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.projects=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'frentes'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.frentes=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'tasks'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'checklist'),orderBy('order','asc')),s=>{S.checklist=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'deliveries'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.deliveries=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'comments'),orderBy('createdAt','asc')),s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'requests'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
    onSnapshot(query(collection(db,'ratings'),where('clientId','==',cid),orderBy('createdAt','desc')),s=>{S.ratings=s.docs.map(d=>({id:d.id,...d.data()}));rp();}),
  ];
}

      </div>`:''}
    </div>`;}).join('')}
    ${S.deliveries.length===0?'<div class="empty">Nenhuma entrega ainda. A agência enviará os arquivos aqui quando estiverem prontos.</div>':''}`;

  }else if(tab==='solicitar'){
    mc.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:flex-start;">
    <div>
      <div class="sec-t">Nova solicitação</div>
      <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:20px;">
        <div class="fg"><label>Título da solicitação</label><input id="ps-ti" placeholder="Ex: Banner para LinkedIn"></div>
        <div class="fg"><label>Projeto relacionado</label><select id="ps-pj"><option value="">Sem projeto específico</option>${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
        <div class="fg"><label>Tipo de demanda</label><select id="ps-ty">${FRENTE_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div class="fg"><label>Prioridade</label><select id="ps-pr"><option value="normal">Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
        <div class="fg"><label>Descrição detalhada</label><textarea id="ps-dc" placeholder="Descreva o que precisa, contexto, onde será usado, formato etc."></textarea></div>
        <div class="fg"><label>Links de referência (separe por vírgula)</label><input id="ps-lk" placeholder="https://drive.google.com/..."></div>
        <div id="ps-ok" style="display:none;background:var(--greenL);color:var(--greenD);border-radius:9px;padding:11px;font-size:12px;margin-bottom:12px;text-align:center;font-weight:700;">✅ Solicitação enviada! Retornaremos em breve.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="bo" onclick="['ps-ti','ps-dc','ps-lk'].forEach(i=>{const e=document.getElementById(i);if(e)e.value=''})">Limpar</button><button class="bp" onclick="submitReq()">Enviar solicitação →</button></div>
      </div>
    </div>
    <div>
      <div class="sec-t">Histórico de solicitações</div>
      ${reqs.map(r=>`<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><div style="font-size:13px;font-weight:700;color:var(--text);">${r.title}</div><div style="display:flex;gap:5px;">${pb(r.priority)}${bdg(r.status,r.status==='recebido'?'var(--blueL)':'var(--greenL)',r.status==='recebido'?'var(--blueD)':'var(--greenD)')}</div></div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:5px;">${r.description||''}</div>
        <div style="font-size:10px;color:var(--text3);">${r.type||''} · ${ft(r.createdAt)}</div>
      </div>`).join('')}
      ${reqs.length===0?'<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:36px;text-align:center;font-size:12px;color:var(--text3);">Nenhuma solicitação enviada ainda</div>':''}
    </div></div>`;

  }else if(tab==='comunicacao'){
    mc.innerHTML=`<div class="sec-t">Mensagens por projeto</div>
    ${ps.map(p=>{const pcmts=S.comments.filter(cm=>cm.projectId===p.id&&!cm.deliveryId);return`<div style="margin-bottom:18px;">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;"><span style="font-size:14px;font-weight:700;color:var(--text);">${p.name}</span><span style="font-size:10px;color:var(--text3);">${pcmts.length} mensagem(ns)</span></div>
      <div class="cmt-box">
        ${pcmts.map(cm=>`<div class="cmt"><div class="cmt-h"><div class="cmt-av" style="background:${cm.authorRole==='agency'?'var(--purple)':'var(--purpleL)'};color:${cm.authorRole==='agency'?'#fff':'var(--purple)'};">${(cm.authorName||'?')[0]}</div><span class="cmt-au">${cm.authorName}</span><span class="cmt-tm">${ft(cm.createdAt)}</span></div><div class="cmt-tx">${cm.text}</div></div>`).join('')}
        ${pcmts.length===0?'<div class="empty">Nenhuma mensagem ainda. Inicie a conversa!</div>':''}
        <div class="inp-row"><input class="cmt-inp" id="pco-${p.id}" placeholder="Escrever para a agência..."><button class="bp" onclick="sendPCO('${p.id}')">Enviar</button></div>
      </div>
    </div>`;}).join('')}
    ${ps.length===0?'<div class="empty">Nenhum projeto ativo</div>':''}`;

  }else if(tab==='avaliar'){
    const myRatings=S.ratings;
    const avgScore=myRatings.length?Math.round(myRatings.reduce((a,r)=>a+r.score,0)/myRatings.length):null;
    mc.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:flex-start;">
    <div>
      <div class="sec-t">Avaliar atendimento</div>
      <div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;padding:20px;">
        <div class="fg"><label>Projeto avaliado</label><select id="rt-pj"><option value="">Geral (todos os projetos)</option>${ps.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
        <div class="fg"><label>Sua satisfação geral (1-5 estrelas)</label>
          <div class="stars" id="starContainer">
            ${[1,2,3,4,5].map(n=>`<span class="star" onclick="setStar(${n})" id="star-${n}">☆</span>`).join('')}
          </div>
          <input type="hidden" id="rt-score" value="0">
        </div>
        <div class="fg"><label>O que estamos fazendo bem?</label><textarea id="rt-pos" placeholder="Pontos positivos do atendimento..."></textarea></div>
        <div class="fg"><label>O que podemos melhorar?</label><textarea id="rt-neg" placeholder="Sugestões ou pontos a melhorar..."></textarea></div>
        <div class="fg"><label>Comentário adicional (opcional)</label><input id="rt-cm" placeholder="Alguma observação extra?"></div>
        <div id="rt-ok" style="display:none;background:var(--greenL);color:var(--greenD);border-radius:9px;padding:11px;font-size:12px;margin-bottom:12px;text-align:center;font-weight:700;">⭐ Obrigado pela avaliação!</div>
        <button class="bp" style="width:100%;" onclick="submitRating()">Enviar avaliação</button>
      </div>
    </div>
    <div>
      <div class="sec-t">Histórico de avaliações</div>
      ${avgScore!==null?`<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;text-align:center;">
        <div style="font-size:36px;font-weight:700;color:${avgScore<70?'var(--red)':avgScore<85?'var(--amber)':'var(--green)'};">${avgScore}%</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:8px;">Satisfação média</div>
        <div style="height:8px;background:var(--bg3);border-radius:8px;overflow:hidden;"><div style="height:100%;width:${avgScore}%;background:${avgScore<70?'var(--red)':avgScore<85?'var(--amber)':'var(--green)'};border-radius:8px;transition:width .5s;"></div></div>
      </div>`:''}
      ${myRatings.map(r=>{const stars=Math.round(r.score/20);return`<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
          <div style="font-size:14px;">{'⭐'.repeat(stars)}</div>
          <div style="font-size:11px;color:var(--text3);">${ft(r.createdAt)}</div>
        </div>
        ${r.positive?`<div style="font-size:12px;color:var(--greenD);margin-bottom:4px;">✅ ${r.positive}</div>`:''}
        ${r.negative?`<div style="font-size:12px;color:var(--amberD);margin-bottom:4px;">💡 ${r.negative}</div>`:''}
        ${r.comment?`<div style="font-size:12px;color:var(--text2);">${r.comment}</div>`:''}
      </div>`;}).join('')}
      ${myRatings.length===0?'<div style="background:var(--bg2);border:0.5px solid var(--border);border-radius:12px;padding:36px;text-align:center;font-size:12px;color:var(--text3);">Nenhuma avaliação enviada ainda</div>':''}
    </div></div>`;

    // Init stars
    setTimeout(()=>{const sc=$('rt-score');if(sc&&parseInt(sc.value)>0)setStar(Math.round(parseInt(sc.value)/20));},50);
  }
}

// PORTAL ACTIONS
let _starVal=0;
window.setStar=n=>{
  _starVal=n;
  const sc=$('rt-score');if(sc)sc.value=n*20;
  [1,2,3,4,5].forEach(i=>{const s=$('star-'+i);if(s)s.textContent=i<=n?'⭐':'☆';});
};
window.approveDel=async id=>{await updateDoc(doc(db,'deliveries',id),{status:'aprovado'});await addDoc(collection(db,'comments'),{deliveryId:id,text:'✅ Entrega aprovada!',authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});};
window.sendPDC=async id=>{const el=$('pdc-'+id);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{deliveryId:id,text:t,authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});el.value='';};
window.sendPCO=async pid=>{const el=$('pco-'+pid);const t=el?.value.trim();if(!t)return;await addDoc(collection(db,'comments'),{projectId:pid,text:t,authorName:S.cd?.name||'Cliente',authorRole:'client',createdAt:serverTimestamp()});el.value='';};
window.submitReq=async()=>{
  const ti=fval('ps-ti'),dc=fval('ps-dc');if(!ti||!dc)return alert('Preencha título e descrição.');
  const ty=$('ps-ty')?.value,pj=$('ps-pj')?.value,pr=$('ps-pr')?.value,lk=fval('ps-lk');
  const fileLinks=lk?lk.split(',').map(l=>l.trim()).filter(Boolean):[];
  const proj=S.projects.find(p=>p.id===pj);
  await addDoc(collection(db,'requests'),{title:ti,description:dc,type:ty,projectId:pj||'',projectName:proj?.name||'',priority:pr,fileLinks,clientId:S.profile.clientId,clientName:S.cd?.name||'',status:'recebido',createdAt:serverTimestamp()});
  ['ps-ti','ps-dc','ps-lk'].forEach(i=>{const e=$(i);if(e)e.value='';});
  const ok=$('ps-ok');if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',4000);}
};
window.submitRating=async()=>{
  const score=parseInt($('rt-score')?.value||0);if(!score)return alert('Selecione a quantidade de estrelas.');
  const pos=fval('rt-pos'),neg=fval('rt-neg'),cm=fval('rt-cm'),pj=$('rt-pj')?.value;
  await addDoc(collection(db,'ratings'),{score,positive:pos||'',negative:neg||'',comment:cm||'',projectId:pj||'',clientId:S.profile.clientId,clientName:S.cd?.name||'',createdAt:serverTimestamp()});
  ['rt-pos','rt-neg','rt-cm'].forEach(i=>{const e=$(i);if(e)e.value='';});
  _starVal=0;[1,2,3,4,5].forEach(i=>{const s=$('star-'+i);if(s)s.textContent='☆';});
  const ok=$('rt-ok');if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',4000);}
};

document.addEventListener('keydown',e=>{if(e.key==='Escape')cm();});
</script>
</body>
</html>
